<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Agent Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: lavender tab bar on top; below it a home grid or a workspace of two floating cards (chat left, preview right). */
:root {
  --top-a: #b7b0f4;
  --top-b: #d9e4fa;
  --bg: #f4f3fb;
  --panel: #ffffff;
  --fg: #1f1d33;
  --muted: #67657f;
  --line: #e4e2f1;
  --accent: #5646e0;
  --accent-ink: #ffffff;
  --accent-soft: #e9e6fd;
  --bubble: #e9e6fd;
  --bubble-fg: #2a2370;
  --dark: #24213a;
  --dark-fg: #ffffff;
  --ok: #16a35f;
  --warn: #f2c14e;
  --warn-fg: #3a2d00;
  --danger: #d6455d;
  --s-accent: #0e9f8e;
  --s-soft: #d7f3ee;
  --code-bg: #14131f;
  --code-fg: #d9d6f0;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --top-a: #2a2660; --top-b: #1d3358; --bg: #12111c; --panel: #1b1a29; --fg: #ecebf6; --muted: #a09eb8;
    --line: #2c2a40; --accent: #8f84ff; --accent-ink: #14113a; --accent-soft: #2a2750; --bubble: #2a2750;
    --bubble-fg: #e2defc; --dark: #ecebf6; --dark-fg: #14131f; --ok: #3ccf8a; --warn: #f0c75a; --warn-fg: #2f2400;
    --danger: #ff7a90; --s-accent: #3ed1bd; --s-soft: #153a36; --code-bg: #0c0b14; --code-fg: #d9d6f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --top-a: #2a2660; --top-b: #1d3358; --bg: #12111c; --panel: #1b1a29; --fg: #ecebf6; --muted: #a09eb8;
  --line: #2c2a40; --accent: #8f84ff; --accent-ink: #14113a; --accent-soft: #2a2750; --bubble: #2a2750;
  --bubble-fg: #e2defc; --dark: #ecebf6; --dark-fg: #14131f; --ok: #3ccf8a; --warn: #f0c75a; --warn-fg: #2f2400;
  --danger: #ff7a90; --s-accent: #3ed1bd; --s-soft: #153a36; --code-bg: #0c0b14; --code-fg: #d9d6f0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }
.spacer { flex: 1; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; min-width: 0; }

/* top bar */
.topbar {
  display: flex; align-items: flex-end; gap: 6px; padding: 12px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  background: linear-gradient(100deg, var(--top-a), var(--top-b)); min-width: 0;
}
.brand { display: flex; align-items: center; gap: 8px; align-self: center; margin: 0 10px 8px 0; font-weight: 700; white-space: nowrap; }
.brand i { width: 26px; height: 26px; border-radius: 8px; background: var(--dark); color: var(--dark-fg); display: grid; place-items: center; }
.tabs { display: flex; align-items: flex-end; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 12px 12px 0 0;
  font-weight: 500; white-space: nowrap; color: color-mix(in srgb, var(--fg) 80%, transparent);
}
.tab:hover { background: color-mix(in srgb, var(--panel) 40%, transparent); }
.tab[aria-selected="true"] { background: var(--bg); color: var(--fg); font-weight: 600; height: 44px; }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.tab .dot.idle { background: var(--muted); }
.tab .x { padding: 3px; border-radius: 6px; color: var(--muted); display: grid; }
.tab .x:hover { background: var(--line); }
.newtab { align-self: center; margin: 0 0 6px 4px; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
.newtab:hover { background: color-mix(in srgb, var(--panel) 45%, transparent); }
.plan { align-self: center; margin: 0 6px 6px; background: var(--warn); color: var(--warn-fg); font-weight: 700; padding: 6px 14px; border-radius: 10px; white-space: nowrap; }
.me-av { align-self: center; margin: 0 0 6px; width: 34px; height: 34px; border-radius: 50%; background: var(--dark); color: var(--dark-fg); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }

/* home */
.home { padding: 28px max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); overflow-y: auto; min-height: 0; }
.home-in { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.home h1 { margin: 0; font-size: 26px; line-height: 1.2; text-wrap: balance; }
.home p.sub { margin: 4px 0 0; color: var(--muted); }
.newform { display: flex; gap: 8px; flex-wrap: wrap; }
.newform input { flex: 1; min-width: 180px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
.btn { padding: 10px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pcard h3 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.pcard .meta { color: var(--muted); font-size: 12.5px; }
.bar-track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
.prow { display: flex; gap: 8px; margin-top: 4px; }
.prow .btn { padding: 7px 14px; }
.chip-s { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }

/* workspace */
.work { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 12px; padding: 12px max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px)); min-height: 0; }
.work.hide-chat { grid-template-columns: minmax(0, 1fr); }
.work.hide-chat .chat { display: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.thread { flex: 1; overflow-y: auto; padding: 20px 18px 8px; display: flex; flex-direction: column; gap: 18px; min-height: 0; scroll-behavior: smooth; }
.msg.me { align-self: flex-end; max-width: 85%; }
.msg.me .bubble { background: var(--bubble); color: var(--bubble-fg); padding: 9px 14px; border-radius: 16px 16px 4px 16px; font-weight: 500; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.agent { display: flex; gap: 10px; align-items: flex-start; }
.bot { width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.msg .body { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 3px; }
.msg .body p { margin: 0; line-height: 1.6; overflow-wrap: anywhere; }
.steps { list-style: none; margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.steps li { display: flex; align-items: center; gap: 8px; }
.steps .ck { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.steps li.done .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps li:not(.done) .ck { border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.typing { display: inline-flex; gap: 4px; padding: 10px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
.chat { position: relative; }
.jump { position: absolute; left: 50%; bottom: 150px; margin-left: -18px; width: 36px; height: 36px; border-radius: 50%; background: var(--dark); color: var(--dark-fg); display: grid; place-items: center; box-shadow: 0 4px 12px rgb(0 0 0 / .25); z-index: 3; }
.dock { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 0; }
.status { display: flex; align-items: center; gap: 10px; padding: 10px 12px 14px; margin-bottom: -6px; border-radius: 14px 14px 0 0; background: var(--accent-soft); flex-wrap: wrap; }
.status .lbl { font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 10px; flex: 1; min-width: 120px; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.auto { display: flex; align-items: center; gap: 6px; background: var(--dark); color: var(--dark-fg); padding: 7px 12px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
.stop { display: flex; align-items: center; gap: 6px; background: var(--danger); color: #fff; padding: 7px 12px; border-radius: 10px; font-weight: 600; }
.status .x { padding: 4px; color: var(--muted); display: grid; }
.sugg { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
.sugg button { padding: 5px 11px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); background: var(--panel); font-size: 13px; text-align: left; }
.sugg button:hover { background: var(--bg); }
.box { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 4px; }
.box textarea { width: 100%; min-height: 44px; max-height: 160px; resize: none; border: 0; background: none; font-size: 15px; line-height: 1.45; outline: none; }
.box:focus-within { border-color: var(--accent); }
.box textarea::placeholder { color: var(--muted); }
.tools { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.t { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 9px; font-weight: 500; position: relative; }
.t:hover { background: var(--line); }
.send { width: 40px; height: 32px; border-radius: 16px; background: var(--line); color: var(--muted); display: grid; place-items: center; margin-left: 4px; }
.send.ready { background: var(--accent); color: var(--accent-ink); }
.menu { position: absolute; bottom: calc(100% + 6px); right: 0; min-width: 210px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); z-index: 5; display: flex; flex-direction: column; }
.menu button { text-align: left; padding: 8px 10px; border-radius: 8px; display: flex; flex-direction: column; }
.menu button:hover, .menu button[aria-checked="true"] { background: var(--accent-soft); }
.menu small { color: var(--muted); font-size: 12px; }

/* right */
.sbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sq { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; background: var(--panel); position: relative; }
.sq:hover { background: var(--bg); }
.toggle { display: flex; padding: 3px; border-radius: 12px; background: var(--bg); gap: 2px; border: 1px solid var(--line); }
.toggle button { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 9px; font-weight: 500; }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.confirm { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.confirm button { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); }
.confirm .yes { background: var(--danger); color: #fff; border-color: transparent; }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 18px; }
.drop { border: 2px dashed var(--line); border-radius: 16px; padding: 22px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--bg); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop p { margin: 0; color: var(--muted); max-width: 38ch; text-wrap: balance; }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.files li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.files .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files .sz { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.files button { padding: 4px; color: var(--muted); display: grid; border-radius: 6px; }
.files button:hover { background: var(--line); }
.tip { border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-height: 110px; display: flex; flex-direction: column; gap: 6px; }
.tip h4 { margin: 0; font-size: 15px; }
.tip p { margin: 0; color: var(--muted); }
.car { display: flex; align-items: center; justify-content: center; gap: 12px; }
.car .nav { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
.dots { display: flex; gap: 6px; align-items: center; }
.dots button { width: 8px; height: 8px; border-radius: 50%; background: var(--line); padding: 0; transition: width .2s; }
.dots button[aria-current="true"] { width: 28px; border-radius: 4px; background: var(--fg); }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 34ch; display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 12px; }
.empty b { color: var(--fg); font-size: 16px; }

/* mock browser + generated site */
.browser { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.chrome { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.chrome i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.chrome .url { flex: 1; min-width: 0; background: var(--panel); border-radius: 8px; padding: 3px 10px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site { padding: 0 0 24px; background: var(--panel); }
.s-nav { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.s-logo { display: flex; align-items: center; gap: 6px; margin-right: auto; }
.s-logo i { width: 18px; height: 18px; border-radius: 6px; background: var(--s-accent); }
.s-nav span { color: var(--muted); }
.s-btn { background: var(--s-accent); color: #fff; padding: 6px 14px; border-radius: 9px; font-weight: 600; }
.s-hero { padding: 34px 18px 22px; background: linear-gradient(180deg, var(--s-soft), transparent); display: flex; flex-direction: column; gap: 10px; }
.s-hero h2 { margin: 0; font-size: 28px; line-height: 1.15; max-width: 18ch; text-wrap: balance; }
.s-hero p { margin: 0; color: var(--muted); max-width: 46ch; }
.s-sec { padding: 20px 18px 0; display: flex; flex-direction: column; gap: 12px; }
.s-sec h3 { margin: 0; font-size: 18px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filters input { flex: 1; min-width: 140px; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.filters button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); }
.filters button[aria-pressed="true"] { background: var(--s-accent); border-color: var(--s-accent); color: #fff; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.course { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.course .ti { height: 56px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 20px; }
.course b { overflow-wrap: anywhere; }
.course small { color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.tile b { font-size: 22px; display: block; font-variant-numeric: tabular-nums; }
.tile small { color: var(--muted); }
.wk { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding-top: 8px; }
.wk div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; height: 100%; }
.wk i { width: 100%; max-width: 34px; background: var(--s-accent); border-radius: 6px 6px 2px 2px; }
.wk small { color: var(--muted); font-size: 11px; }
.quizbox { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); }
.opt:hover:not(:disabled) { background: var(--bg); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.opt.wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }

/* code */
.codewrap { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 12px; min-height: 0; }
.ftree { display: flex; flex-direction: column; gap: 2px; }
.ftree button { text-align: left; padding: 6px 8px; border-radius: 8px; font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.ftree button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 12px; padding: 14px; overflow: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; min-height: 180px; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--dark); color: var(--dark-fg); padding: 8px 16px; border-radius: 12px; z-index: 20; box-shadow: 0 6px 20px rgb(0 0 0 / .25); }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; min-height: 100%; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .chat { height: 78vh; min-height: 520px; }
  .side { min-height: 560px; }
  .codewrap { grid-template-columns: minmax(0, 1fr); }
  .ftree { flex-direction: row; flex-wrap: wrap; }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .steps li:not(.done) .ck, .typing i { animation: none; } .thread { scroll-behavior: auto; } .dots button { transition: none; } }

/* ── Breadwinner: Home Section (Hero 3.500+ Apps Canvas) ───────── */
.bw-hero {
  position: relative;
  min-height: 380px;
  border-radius: 24px;
  overflow: hidden;
  background: #080c16;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 24px 56px -12px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 32px 32px 24px;
  color: #f1f5f9;
}
#heroBgCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}
.bw-hero-depth {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 75% 65% at 70% 50%, transparent 20%, rgba(8, 12, 22, 0.82) 100%),
    linear-gradient(180deg, rgba(8, 12, 22, 0.25) 0%, rgba(8, 12, 22, 0.88) 100%);
  box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.7);
}
.bw-hero-content {
  position: relative;
  z-index: 2;
  max-width: 540px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.bw-hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.16);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #c9d5f5;
  width: fit-content;
}
.bw-badge-pulse {

  /* ---------- Agent Adapter (Dual Mode: Live Claude API + Fallback) ----------

  var Adapter = {
    reply: function (text, ctx) {
      return fetch('/api/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: text,
          projectName: ctx.p ? ctx.p.name : '',
          stage: ctx.p ? ctx.p.stage : 0,
          mode: ctx.mode,
          build: ctx.build,
          history: (ctx.p && ctx.p.msgs ? ctx.p.msgs.slice(-6) : [])
        })
      })
      .then(function (res) {
        if (!res.ok) throw new Error('API ' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (data && data.text) {
          return {
            text: data.text,
            steps: Array.isArray(data.steps) ? data.steps : ['Memproses dengan Claude AI', 'Menyiapkan modul'],
            stage: typeof data.stage === 'number' ? data.stage : Math.min(4, (ctx.p ? ctx.p.stage : 0) + 1),
            suggest: Array.isArray(data.suggest) && data.suggest.length ? data.suggest : suggestFor(ctx.p ? ctx.p.stage : 0, ctx.mode)
          };
        }
        throw new Error('Invalid response');
      })
      .catch(function () {
        return new Promise(function (res) {
          setTimeout(function () { res(brain(text, ctx)); }, 600 + Math.random() * 500);
        });
      });
    }
  };
  function suggestFor(stage, mode) {
    if (mode === 'Manual') return [];

  }

    if (s === 0 && has(/siswa|sma|smp|mahasiswa|pekerja|sekolah|guru|anak|kuliah|upskill|pengguna/)) target = 1;
    else if (has(/kuis|quiz|ujian|soal/)) target = 4;
    else if (has(/dashboard|progres|statistik|grafik/)) target = 3;
    else if (has(/kursus|katalog|course|materi/)) target = 2;
    else if (s === 0 && has(/mulai|buat|bangun|web|aplikasi|edtech/)) target = 1;
    else if (has(/mulai bangun|bangun sekarang/)) target = Math.min(4, s + 1);
    if (build === 'Ask') {
      return { text: 'Dalam mode Ask saya hanya menjawab dan tidak mengubah proyek.\n\nSaat ini proyek ada di tahap "' + STAGE_LABEL[s] + '". Untuk tahap berikutnya, biasanya saya mulai dari ' + (NEXT[Math.max(0, s - 1)] || 'penyempurnaan tampilan').toLowerCase() + '.', steps: [], stage: s, suggest: suggestFor(s, mode) };

      return { text: 'Ini rencana saya, belum ada yang diubah:\n\n1. Kerangka halaman dan navigasi\n2. Katalog kursus dengan pencarian dan filter level\n3. Dashboard progres belajar mingguan\n4. Kuis interaktif dengan skor\n\nPindah ke mode Build kalau rencana ini sudah cocok.', steps: [], stage: s, suggest: mode === 'Manual' ? [] : ['Mulai bangun sekarang'] };

    }
    if (target <= s) {
      return { text: 'Bagian itu sudah ada di pratinjau (' + STAGE_LABEL[target] + '). Buka tab Live untuk melihatnya, atau minta tahap berikutnya.', steps: [], stage: s, suggest: suggestFor(s, mode) };

      1: ['Baik, saya mulai dari kerangka: navbar, halaman utama, dan data contoh.', ['Membuat struktur halaman', 'Menyusun navbar dan hero', 'Menyiapkan 8 data kursus contoh']],

      3: ['Dashboard progres belajar sedang saya susun: ringkasan, grafik mingguan, dan kursus yang sedang berjalan.', ['Menghitung ringkasan belajar', 'Menggambar grafik menit belajar per hari', 'Menampilkan kursus yang sedang diikuti']],
      4: ['Kuis interaktif saya tambahkan, dengan umpan balik benar atau salah dan skor akhir.', ['Menyiapkan 3 soal contoh', 'Membuat logika penilaian', 'Menampilkan skor akhir']]
    };
    return { text: map[target][0], steps: map[target][1], stage: target, suggest: suggestFor(target, mode) };
  }

        '<rect x="-40" y="-40" width="80" height="80" rx="20" fill="#2d8cff"/><rect x="-26" y="-14" width="32" height="28" rx="7" fill="#fff"/><path d="M10-4L28-15V15L10 4Z" fill="#fff"/>',
        '<rect x="-34" y="-36" width="68" height="72" rx="9" fill="#fff" stroke="#111" stroke-width="6"/><path d="M-14 24V-24L14 24V-24" fill="none" stroke="#111" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>',
        '<rect x="-38" y="-38" width="76" height="76" rx="18" fill="#000"/><path d="M-18-18L18 18M18-18L-18 18" stroke="#fff" stroke-width="7" stroke-linecap="round"/>'
      ];
      var defs = '<defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#d62976"/><stop offset=".7" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs>';
      var IM = IC.map(function(s) {
        var img = new Image();
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100" width="200" height="200">' + defs + s + '</svg>');
        return img;
      });
      window._heroCanvasMath = { A: A, U: U, P: P, K: K, spr: spr, IM: IM, rr: rr };
    }

    var math = window._heroCanvasMath;
    var R = new Float32Array(N);
    var pk = [];
    var last = 0, acc = 0, glow = 0;
    var OR = "#ff3d00";
    var animId = null;
    var running = true;

    function rs() {
      if (!box || !cv) return;
      D = Math.min(window.devicePixelRatio || 1, 2);
      W = box.clientWidth;
      H = box.clientHeight;
      if (W < 10 || H < 10) return;
      cv.width = W * D;
      cv.height = H * D;
      M = Math.min(W, H);
      X = W > 840 ? W * 0.70 : W / 2;
      Y = W > 840 ? H * 0.50 : H * 0.44;
      Rh = Math.max(32, M * 0.11);
      Rf = Math.max(85, M * 0.32);
      Rl = Math.max(18, M * 0.075);
      r0 = Rf + Rl * 1.6;
      Rmax = Math.hypot(W, H) / 2 * 1.15;
      S = Math.sqrt(Math.PI * (Rmax * Rmax - r0 * r0) / N);
      for (var i = 0; i < N; i++) R[i] = r0 + (Rmax - r0) * math.U[i];
      if (RM) draw(0);
    }

    function tp(i, rot) {
      var a = math.A[i] + rot;
      return [X + R[i] * Math.cos(a), Y + R[i] * Math.sin(a)];
    }

    function draw(t) {
      if (!running || !cv) return;
      var dt = Math.min(0.05, Math.max(0, t - last));
      last = t;
      cx.setTransform(D, 0, 0, D, 0, 0);
      cx.clearRect(0, 0, W, H);
      var rot = t * 0.025, sz = S * 0.82;

      for (var i = 0; i < N; i++) {
        var a = math.A[i] + rot, d = R[i], x = X + d * Math.cos(a), y = Y + d * Math.sin(a);
        if (x < -sz || x > W + sz || y < -sz || y > H + sz) continue;
        var k = 0.5 + 0.5 * Math.sin(t * 1.6 - d * 0.018 + math.P[i] * 0.12), s = sz * (0.85 + 0.3 * k);
        cx.globalAlpha = 0.38 + 0.52 * k;
        cx.drawImage(math.spr[math.K[i]], x - s / 2, y - s / 2, s, s);
      }
      cx.globalAlpha = 1;

      if (!RM) {
        acc += dt * 55;
        while (acc > 1) {
          acc--;
          if (pk.length < 160) {
            for (var q = 0; q < 6; q++) {
              var idx = (Math.random() * N) | 0, pt = tp(idx, rot);
              if (pt[0] > 0 && pt[0] < W && pt[1] > 0 && pt[1] < H) {
                pk.push({ i: idx, p: 0, v: 0.45 + Math.random() * 0.7 });
                break;
              }
            }
          }
        }
      }

      cx.lineCap = "round";
      cx.lineWidth = Math.max(1.5, M * 0.0025);
      cx.strokeStyle = OR;
      for (var n = pk.length - 1; n >= 0; n--) {
        var o = pk[n];
        o.p += dt * o.v;
        if (o.p >= 1) {
          pk.splice(n, 1);
          glow = Math.min(1, glow + 0.12);

        }
        var p = tp(o.i, rot), aa = Math.max(0, o.p - 0.2);
        cx.globalAlpha = 0.9;
        cx.beginPath();
        cx.moveTo(p[0] + (X - p[0]) * aa, p[1] + (Y - p[1]) * aa);
        cx.lineTo(p[0] + (X - p[0]) * o.p, p[1] + (Y - p[1]) * o.p);
        cx.stroke();
      }
      cx.globalAlpha = 1;
      glow = Math.max(0, glow - dt * 0.8);

      for (var k2 = 0; k2 < 3; k2++) {
        var ph = ((t / 2.8) + k2 / 3) % 1;
        cx.globalAlpha = (1 - ph) * 0.35;
        cx.lineWidth = 2;
        cx.beginPath();
        cx.arc(X, Y, Rh + ph * (Rmax - Rh), 0, TAU);
        cx.stroke();
      }
      cx.globalAlpha = 1;

      var lw = Math.max(2, M * 0.004);
      for (var j = 0; j < 12; j++) {
        var ang = j / 12 * TAU - Math.PI / 2 + t * 0.04, c = Math.cos(ang), s = Math.sin(ang);

        var ex = lx - c * (Rl + 4), ey = ly - s * (Rl + 4);

        cx.lineWidth = lw;
        cx.setLineDash([M * 0.014, M * 0.012]);
        cx.lineDashOffset = -t * 45 * (j % 2 ? 1 : -1);
        cx.beginPath();
        cx.moveTo(sx, sy);
        cx.lineTo(ex, ey);
        cx.stroke();
        cx.setLineDash([]);
        var q2 = ((t * 0.3 + j * 0.37) % 1), pp = j % 2 ? q2 : 1 - q2;
        cx.fillStyle = OR;
        cx.beginPath();
        cx.arc(sx + (ex - sx) * pp, sy + (ey - sy) * pp, M * 0.0065, 0, TAU);
        cx.fill();
        var mx = (sx + ex) / 2, my = (sy + ey) / 2, pr = M * 0.016;
        cx.beginPath();
        cx.arc(mx, my, pr, 0, TAU);
        cx.fill();
        cx.strokeStyle = "#fff";
        cx.lineWidth = Math.max(2, pr * 0.28);
        cx.beginPath();
        cx.moveTo(mx - pr * 0.5, my);
        cx.lineTo(mx + pr * 0.5, my);
        cx.moveTo(mx, my - pr * 0.5);
        cx.lineTo(mx, my + pr * 0.5);
        cx.stroke();

        var rl = Rl * (1 + 0.04 * Math.sin(t * 2 + j));
        cx.save();
        cx.shadowColor = "rgba(10,26,51,0.3)";
        cx.shadowBlur = M * 0.03;
        cx.shadowOffsetY = M * 0.008;
        cx.fillStyle = "#fff";
        cx.beginPath();
        cx.arc(lx, ly, rl, 0, TAU);
        cx.fill();
        cx.restore();

        var im = math.IM[j];

      cx.save();

      cx.shadowBlur = M * 0.04;
      cx.shadowOffsetY = M * 0.01;
      cx.fillStyle = "#fff";

      cx.strokeStyle = "rgba(79,134,240,0.55)";

      cx.strokeStyle = "#38e1ff";
      cx.lineWidth = Math.max(2, h * 0.04);
      math.rr(cx, X - c2, Y - c2, c2 * 2, c2 * 2, c2 * 0.32);
      cx.fill();
      cx.stroke();
      cx.fillStyle = "#fff";
      cx.font = "800 " + (c2 * 1.1) + "px system-ui, Segoe UI, Arial, sans-serif";
      cx.textAlign = "center";
      cx.textBaseline = "middle";
      cx.fillText("AI", X, Y + c2 * 0.05);
    }

    function loop(ts) {
      if (!running) return;
      draw(ts / 1000);
      animId = requestAnimationFrame(loop);
    }

    rs();
    window.addEventListener('resize', rs);
    if (!RM) animId = requestAnimationFrame(loop);

    var nm = document.getElementById("heroNum");
    if (nm) {
      var c0 = performance.now();
      function cnt(now) {
        if (!running || !document.getElementById("heroNum")) return;
        var p = Math.min(1, (now - c0) / 3200), e = 1 - Math.pow(1 - p, 3);

        if (p < 1) requestAnimationFrame(cnt);
      }
      if (RM) nm.textContent = "3.500+";
      else requestAnimationFrame(cnt);
    }

    heroCanvasState = {
      cv: cv,
      running: true,
      destroy: function() {
        running = false;
        this.running = false;
        window.removeEventListener('resize', rs);
        if (animId) cancelAnimationFrame(animId);
      }
    };
  }

    q.innerHTML = '<small style="color:var(--muted)">Soal ' + (live.qi + 1) + ' dari ' + QUIZ.length + '</small><b></b>' + it.o.map(function (o, i) {
      var c = live.picked < 0 ? '' : (i === it.a ? ' right' : (i === live.picked ? ' wrong' : ''));
      return '<button class="opt' + c + '" type="button" data-o="' + i + '"' + (live.picked >= 0 ? ' disabled' : '') + '></button>';
    }).join('') + (live.picked >= 0 ? '<button class="btn" type="button" data-qn="1" style="align-self:flex-start">' + (live.qi === QUIZ.length - 1 ? 'Lihat skor' : 'Soal berikutnya') + '</button>' : '');
    q.querySelector('b').textContent = it.q;
    var os = q.querySelectorAll('.opt'); it.o.forEach(function (o, i) { os[i].textContent = o; });
  }
  function codeFor(f) {
    if (f === 'index.html') return '<!doctype html>\n<html lang="id">\n<head>\n  <title>BelajarKita</title>\n  <link rel="stylesheet" href="styles.css">\n</head>\n<body>\n  <nav class="s-nav">\n    <b class="s-logo">BelajarKita</b>\n    <a href="#kursus">Kursus</a>\n  </nav>\n  <section class="s-hero">\n    <h2>Belajar terarah, satu kelas pendek setiap hari</h2>\n  </section>\n  <main id="app"></main>\n  <script type="module" src="courses.js"><\/script>\n</body>\n</html>';
    if (f === 'courses.js') return 'export const courses = ' + JSON.stringify(COURSES.slice(0, 3).map(function (c) { return { id: c.id, title: c.t, level: c.lv, lessons: c.les }; }), null, 2) + ';\n// ...dan ' + (COURSES.length - 3) + ' kursus contoh lainnya\n\nexport function filterCourses(list, q, level) {\n  return list.filter(c =>\n    (level === "Semua" || c.level === level) &&\n    c.title.toLowerCase().includes(q.toLowerCase()));\n}';
    if (f === 'dashboard.js') return 'const week = ' + JSON.stringify(WEEK) + ';\n\nexport const totalMinutes = week.reduce((sum, [, m]) => sum + m, 0);\n// totalMinutes = ' + WEEK.reduce(function (a, w) { return a + w[1]; }, 0) + '\n\nexport function barHeight(minutes, max = 80, px = 84) {\n  return Math.round((minutes / max) * px);\n}';
    return 'export const quiz = [\n  {\n    q: ' + JSON.stringify(QUIZ[0].q) + ',\n    options: ' + JSON.stringify(QUIZ[0].o) + ',\n    answer: ' + QUIZ[0].a + '\n  }\n  // ...' + (QUIZ.length - 1) + ' soal lainnya\n];\n\nexport const score = (picked) =>\n  picked.filter((p, i) => p === quiz[i].answer).length;';
  }
  function renderSide() {
    var p = cur(); if (!p) return;
    Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.m === uiMode)); });
    var pane = $('#pane'), h = '';
    if (uiMode === 'preview') {
      h = '<div class="drop" id="drop">' + I.up + '<p>Upload aset dan file media yang bisa dipakai agent di kode Anda.</p><button class="btn" type="button" id="pick">Pilih file</button><small style="color:var(--muted)">atau seret file ke sini</small></div>';
      h += p.assets.length ? '<ul class="files">' + p.assets.map(function (a, i) { return '<li>' + I.file + '<span class="nm"></span><span class="sz">' + size(a.size) + '</span><button type="button" data-rm="' + i + '" aria-label="Hapus aset">' + I.x + '</button></li>'; }).join('') + '</ul>' : '<div class="empty"><b>Belum ada aset</b><span>File yang Anda unggah akan muncul di daftar ini.</span></div>';
      h += '<div class="tip"><h4>' + esc(TIPS[tip][0]) + '</h4><p>' + esc(TIPS[tip][1]) + '</p></div><div class="car"><button class="nav" type="button" id="tp" aria-label="Sebelumnya">' + I.prev + '</button><div class="dots">' + TIPS.map(function (t, i) { return '<button type="button" data-tip="' + i + '" aria-label="Tips ' + (i + 1) + '" aria-current="' + (i === tip) + '"></button>'; }).join('') + '</div><button class="nav" type="button" id="tn" aria-label="Berikutnya">' + I.next + '</button></div>';
    } else if (uiMode === 'live') {
      h = '<div class="browser"><div class="chrome"><i></i><i></i><i></i><span class="url">https://' + esc(p.name) + '.preview.local</span></div>' + siteHTML(p) + '</div>';
    } else if (uiMode === 'radar') {
      h = radarPane();
    } else if (uiMode === 'workflow') {
      h = workflowPane();
    } else {
      var files = FILES.filter(function (f) { return f[1] <= p.stage; });
      if (!files.length) h = '<div class="empty"><b>Belum ada file</b><span>File kode muncul setelah agent mulai membangun.</span></div>';
      else {
        if (!files.some(function (f) { return f[0] === codeFile; })) codeFile = files[0][0];
        h = '<div class="codewrap"><div class="ftree">' + files.map(function (f) { return '<button type="button" data-f="' + f[0] + '" aria-current="' + (f[0] === codeFile) + '">' + f[0] + '</button>'; }).join('') + '</div><pre class="code" tabindex="0"></pre></div>';
      }
    }
    pane.innerHTML = h;
    if (uiMode === 'preview') { var nm = pane.querySelectorAll('.files .nm'); p.assets.forEach(function (a, i) { nm[i].textContent = a.name; nm[i].title = a.name; }); }
    if (uiMode === 'live') { drawCourses(); drawQuiz(); var sq = $('#sq'); if (sq) sq.value = live.q; }
    if (uiMode === 'code') { var pr = pane.querySelector('pre.code'); if (pr) pr.textContent = codeFor(codeFile); }
    if (uiMode === 'radar') {
      var si = $('#skillsInput'); if (si) si.addEventListener('input', function(){ radarState.skills = this.value; });
      var sb = $('#scanBtn'); if (sb) sb.addEventListener('click', runSearch);
    }
  }
  function addFiles(list) {
    var p = cur(); if (!p || !list.length) return;
    Array.prototype.forEach.call(list, function (f) { p.assets.push({ name: f.name, size: f.size }); });
    p.updated = Date.now(); save(); toast(list.length + ' aset ditambahkan'); uiMode = 'preview'; renderSide();
  }
  function renderReset() {
    var r = $('#resetBox');
    if (r.dataset.ask === '1') r.innerHTML = '<span class="confirm">Hapus percakapan?<button type="button" class="yes" data-reset="yes">Ya</button><button type="button" data-reset="no">Batal</button></span>';
    else r.innerHTML = '<button class="sq" type="button" data-reset="ask" aria-label="Reset percakapan">' + I.reset + '</button>';
  }
  function render() {
    var onHome = state.active === 'home';
    $('#home').hidden = !onHome; $('#work').hidden = onHome;
    renderTabs();
    if (onHome) {
      renderHome();
    } else {
      if (heroCanvasState) heroCanvasState.destroy();
      if (!cur()) { state.active = 'home'; return render(); }
      renderChat(); renderSide(); renderReset();
    }
  }

  /* ---------- Events ---------- */
  function closeMenu() { var m = $('#menu'); m.hidden = true; $('#modeBtn').setAttribute('aria-expanded', 'false'); $('#buildBtn').setAttribute('aria-expanded', 'false'); }
  function openMenu(kind, btn) {
    var m = $('#menu');
    if (!m.hidden && m.dataset.k === kind) return closeMenu();
    var opts = kind === 'mode' ? [['Auto', 'Agent menyarankan langkah berikutnya'], ['Manual', 'Tanpa saran, Anda yang memutuskan']] : [['Build', 'Bangun dan ubah proyek'], ['Plan', 'Hanya rencana, tanpa perubahan'], ['Ask', 'Tanya jawab saja']];
    var cv = kind === 'mode' ? state.mode : state.build;
    m.dataset.k = kind;
    m.innerHTML = opts.map(function (o) { return '<button type="button" role="menuitemradio" data-v="' + o[0] + '" aria-checked="' + (o[0] === cv) + '"><b>' + o[0] + '</b><small>' + o[1] + '</small></button>'; }).join('');
    m.hidden = false; btn.setAttribute('aria-expanded', 'true');
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    function c(sel) { return t.closest ? t.closest(sel) : null; }
    var el;
    if (!c('#menu') && !c('#modeBtn') && !c('#buildBtn')) closeMenu();
    if ((el = c('[data-close]'))) { var id = el.dataset.close; state.open = state.open.filter(function (x) { return x !== id; }); if (state.active === id) state.active = 'home'; save(); render(); return; }
    if ((el = c('.tab[data-t]'))) { go(el.dataset.t); return; }
    if (c('#newTab')) { go('home'); setTimeout(function () { var n = $('#newName'); if (n) n.focus(); }, 0); return; }
    if ((el = c('[data-open]'))) { go(el.dataset.open); return; }
    if ((el = c('[data-del]'))) {
      if (el.dataset.sure) { var id2 = el.dataset.del; state.projects = state.projects.filter(function (x) { return x.id !== id2; }); state.open = state.open.filter(function (x) { return x !== id2; }); save(); render(); toast('Proyek dihapus'); }
      else { el.dataset.sure = '1'; el.textContent = 'Yakin hapus?'; el.style.color = 'var(--danger)'; }
      return;
    }
    if (c('#jump')) { var th = $('#thread'); th.scrollTop = th.scrollHeight; return; }
    if ((el = c('[data-wa]'))) { window.open('https://wa.me/?text=' + el.dataset.wa, '_blank', 'noopener'); return; }
    if ((el = c('[data-copy]'))) { try { navigator.clipboard.writeText(decodeURIComponent(el.dataset.copy)); toast('✅ Proposal disalin!'); } catch(e){ toast('Salin gagal'); } return; }
    if ((el = c('[data-new-project]'))) { go('home'); setTimeout(function(){ var n=$('#newName'); if(n){n.focus();} },100); return; }
    if ((el = c('[data-open-radar]'))) { var ap = state.projects[0]; if(ap){ go(ap.id); setTimeout(function(){ uiMode='radar'; renderSide(); },200); } return; }
    if ((el = c('[data-open-workflow]'))) { var aw = state.projects[0]; if(aw){ go(aw.id); setTimeout(function(){ uiMode='workflow'; renderSide(); },200); } return; }
    if (c('#autoBtn')) { var p = cur(); if (p && p.suggest[0]) send(p.suggest[0]); return; }
    if (c('#dismissBtn')) { var p2 = cur(); p2.dismissed = true; renderStatus(); return; }
    if ((el = c('[data-s]'))) { var p3 = cur(); send(p3.suggest[+el.dataset.s]); return; }
    if (c('#stopBtn')) { stopRun(); return; }
    if (c('#attach') || c('#pick')) { $('#fileIn').click(); return; }
    if (c('#modeBtn')) { openMenu('mode', $('#modeBtn')); return; }
    if (c('#buildBtn')) { openMenu('build', $('#buildBtn')); return; }
    if ((el = c('#menu [data-v]'))) { if ($('#menu').dataset.k === 'mode') state.mode = el.dataset.v; else state.build = el.dataset.v; save(); closeMenu(); renderChat(); return; }
    if (c('#togChat')) { $('#work').classList.toggle('hide-chat'); return; }
    if ((el = c('#modes button'))) { uiMode = el.dataset.m; renderSide(); return; }
    if (c('#theme')) {
      var root = document.documentElement, cv = root.getAttribute('data-theme');
      var dark = cv === 'dark' || (!cv && window.matchMedia('(prefers-color-scheme: dark)').matches);
      state.theme = dark ? 'light' : 'dark'; root.setAttribute('data-theme', state.theme); save(); return;
    }
    if ((el = c('[data-reset]'))) {
      var r = $('#resetBox'), a = el.dataset.reset;
      if (a === 'ask') { r.dataset.ask = '1'; renderReset(); }
      else if (a === 'no') { r.dataset.ask = '0'; renderReset(); }
      else { var pr = cur(); runId++; pr.busy = false; pr.stage = 0; pr.msgs = [greet()]; pr.suggest = AUDIENCE.slice(); pr.dismissed = false; resetLive(); r.dataset.ask = '0'; save(); render(); toast('Percakapan direset'); }
      return;
    }
    if ((el = c('[data-rm]'))) { var pa = cur(); pa.assets.splice(+el.dataset.rm, 1); save(); renderSide(); return; }
    if (c('#tp')) { tip = (tip + TIPS.length - 1) % TIPS.length; renderSide(); return; }
    if (c('#tn')) { tip = (tip + 1) % TIPS.length; renderSide(); return; }
    if ((el = c('[data-tip]'))) { tip = +el.dataset.tip; renderSide(); return; }
    if ((el = c('[data-lv]'))) { live.lvl = el.dataset.lv; drawCourses(); return; }
    if ((el = c('[data-o]'))) { if (live.picked < 0) { live.picked = +el.dataset.o; if (live.picked === QUIZ[live.qi].a) live.score++; drawQuiz(); } return; }
    if (c('[data-qn]')) { if (live.qi === QUIZ.length - 1) live.done = true; else { live.qi++; live.picked = -1; } drawQuiz(); return; }
    if (c('[data-qr]')) { live.qi = 0; live.score = 0; live.picked = -1; live.done = false; drawQuiz(); return; }
    if ((el = c('[data-f]'))) { codeFile = el.dataset.f; renderSide(); return; }
  });
  document.addEventListener('keydown', function (e) {
    var tg = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && tg.matches && tg.matches('div.tab[data-t]')) { e.preventDefault(); go(tg.dataset.t); }
    if (e.key === 'Escape') closeMenu();
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'msg') { fit(); updSend(); }
    if (e.target.id === 'sq') { live.q = e.target.value; drawCourses(); }
  });
  $('#msg').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(this.value); } });
  $('#form').addEventListener('submit', function (e) { e.preventDefault(); send($('#msg').value); });
  $('#thread').addEventListener('scroll', function () { $('#jump').hidden = nearBottom(this); });
  $('#fileIn').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'newForm') {
      e.preventDefault();
      var n = $('#newName').value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (!n) { toast('Isi nama proyek dulu'); return; }
      var p = mkProject(n, 0); state.projects.unshift(p); state.open.push(p.id); state.active = p.id; save(); render();
    }
  });
  document.addEventListener('dragover', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); addFiles(e.dataTransfer.files); } });

  if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);
  if (state.active !== 'home' && !proj(state.active)) state.active = 'home';
  render();

  // Auto-start project if prompt passed from landing page (?q=...)
  try {
    var up = new URLSearchParams(window.location.search);
    var urlQ = up.get('q');
    if (urlQ && urlQ.trim()) {
      var initialQuery = urlQ.trim();
      var slug = initialQuery.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 28) || 'proyek-baru';
      var np = mkProject(slug, 0);
      state.projects.unshift(np);
      if (state.open.indexOf(np.id) < 0) state.open.push(np.id);
      state.active = np.id;
      save();
      render();
      setTimeout(function () {
        send(initialQuery);
      }, 450);
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }
  } catch (err) {}
})();
</script>

</body></html>
