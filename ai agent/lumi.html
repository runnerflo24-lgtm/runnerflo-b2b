<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi AI — Spesialis Desain Web, UI/UX & Landing Page</title>
<style>
:root{--bg1:#e9e3f7;--bg2:#cfc3ee;--panel:#fff;--side:#fafafa;--ink:#16141c;--mut:#7c7889;--line:#ebe8f1;--acc:#8a6fe6;--accsoft:#efeafd;--btn:#111;--btnink:#fff;--user:#f3f0fb}
:root[data-theme=dark]{--bg1:#1b1730;--bg2:#2a2250;--panel:#16141c;--side:#1b1922;--ink:#f1eff6;--mut:#9a96a8;--line:#2b2835;--acc:#a58cff;--accsoft:#2a2446;--btn:#f1eff6;--btnink:#111;--user:#25222f}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;padding:0;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{width:100%;max-width:none;height:100%;background:var(--panel);border-radius:0;display:flex;overflow:hidden;box-shadow:none}
aside{width:260px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:12px;transition:margin .25s}
.app.collapsed aside{margin-left:-260px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#b9a5ff,#7a5be0);display:grid;place-items:center;color:#fff}
.brand button{margin-left:auto;color:var(--mut);padding:4px;border-radius:6px}
.newchat{background:var(--btn);color:var(--btnink);border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);color:var(--mut)}
.search input{flex:1;border:0;background:none;outline:0;color:var(--ink);font:inherit;min-width:0}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
nav button:hover,nav button.on{background:var(--accsoft)}
.hist{flex:1;overflow:auto;min-height:0}
.grp{font-size:12px;color:var(--mut);margin:12px 6px 4px;font-weight:600}
.item{display:flex;align-items:center;gap:4px;border-radius:8px;padding:0 4px 0 10px}
.item:hover,.item.on{background:var(--accsoft)}
.item button.t{flex:1;text-align:left;padding:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.item .del{opacity:0;color:var(--mut);padding:6px;border-radius:6px}
.item:hover .del{opacity:1}
.empty{color:var(--mut);font-size:13px;padding:10px 6px}
.me{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f3b6c9,#9b86f0);color:#fff;display:grid;place-items:center;font-weight:700}
.me .n{font-weight:600;font-size:13px}.me .m{font-size:12px;color:var(--mut)}
.me button{margin-left:auto;color:var(--mut);padding:6px}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:12px 18px}
.top .sp{flex:1}
.pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;font-weight:600}
.pill:hover,.ib:hover{background:var(--accsoft)}
.ib{padding:7px;border-radius:8px;color:var(--mut)}
.ghost{border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px}
.solid{background:var(--btn);color:var(--btnink);border-radius:10px;padding:7px 14px;font-weight:600;font-size:13px}
.pop{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(40,20,90,.18);padding:6px;z-index:20;min-width:190px}
.pop button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px}
.pop button:hover{background:var(--accsoft)}
.stage{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:0 24px}
.home{margin:auto 0;text-align:center;padding-bottom:10px}
.orb{width:92px;height:92px;margin:0 auto 14px;background:radial-gradient(circle at 35% 30%,#fff 0,#d9ccff 35%,#9f86f0 75%,#7d62dc);animation:morph 9s ease-in-out infinite;box-shadow:0 14px 40px rgba(138,111,230,.45),inset -6px -8px 18px rgba(90,60,200,.25)}
@keyframes morph{0%,100%{border-radius:58% 42% 55% 45%/48% 56% 44% 52%;transform:rotate(0)}50%{border-radius:44% 56% 42% 58%/58% 44% 56% 42%;transform:rotate(18deg)}}
.home h1{font-size:30px;font-weight:600;line-height:1.2;letter-spacing:-.02em}
.home h1 span{color:var(--mut);font-weight:500;font-size:24px}
.msgs{width:100%;max-width:760px;padding:8px 0 20px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px}
.msg.user{justify-content:flex-end}
.bub{max-width:88%;line-height:1.65;overflow-wrap:anywhere}
.msg.user .bub{background:var(--user);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap}
.msg.ai .bub{padding-top:4px}
.msg .mini{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a58cff);flex:none}
.bub pre{background:#15131c;color:#eee;padding:12px;border-radius:10px;overflow:auto;margin:8px 0;font-size:12.5px}
.bub code{font-family:ui-monospace,Menlo,monospace;background:var(--accsoft);padding:1px 5px;border-radius:5px;font-size:12.5px}
.bub pre code{background:none;padding:0}
.bub ul{padding-left:20px}
.acts{display:flex;gap:2px;margin-top:4px;color:var(--mut)}
.acts button{padding:5px;border-radius:6px}.acts button:hover{background:var(--accsoft)}
.dots{display:inline-flex;gap:4px;padding:10px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-3px)}}
.panel{width:100%;max-width:640px;padding:10px 0}
.panel h2{font-size:20px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row .tx{flex:1;overflow:hidden;text-overflow:ellipsis}
.composer{width:100%;max-width:760px;margin:0 auto;padding:0 24px 8px}
.box{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 6px 24px rgba(80,50,160,.08);padding:12px 14px;position:relative}
.box textarea{width:100%;border:0;outline:0;resize:none;background:none;font:inherit;color:var(--ink);max-height:160px;min-height:24px}
.bar{display:flex;align-items:center;gap:8px;margin-top:8px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--accsoft);color:var(--acc);border-color:var(--acc)}
.chip.sm{font-weight:500}
.send{margin-left:auto;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#b9a5ff,#7a5be0);color:#fff;display:grid;place-items:center}
.send:disabled{opacity:.45;cursor:default}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.files .chip{background:var(--accsoft);color:var(--ink)}
.sug{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:760px;margin:14px auto 0;padding:0 24px;width:100%}
.sug button{text-align:left;padding:12px;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.sug button:hover{background:var(--accsoft)}
.sug b{font-size:13px}.sug small{color:var(--mut);font-size:12px;line-height:1.4}
.sug .i{color:var(--mut);margin-bottom:6px;width:18px;height:18px}
.foot{display:flex;align-items:center;justify-content:center;padding:10px 18px;color:var(--mut);font-size:11.5px;gap:8px;position:relative}
.foot .r{position:absolute;right:14px;display:flex}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btnink);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;animation:t .25s}
@keyframes t{from{opacity:0;transform:translate(-50%,8px)}}
@media(max-width:820px){body{padding:0}.app{border-radius:0;height:100%}aside{position:absolute;inset:0 auto 0 0;z-index:30;width:270px;box-shadow:8px 0 30px rgba(0,0,0,.2)}.sug{grid-template-columns:1fr}.home h1{font-size:24px}#exp span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand"><div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></div>Lumi AI<button id="collapse" aria-label="Tutup sidebar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div>
    <button class="newchat" id="new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Chat baru</button>
    <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Cari chat" autocomplete="off"></label>
    <nav>
      <button data-v="home"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Jelajahi</button>
      <button data-v="library"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3z"/></svg>Perpustakaan</button>
      <button data-v="files"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>File</button>
      <button data-v="history"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Riwayat</button>
    </nav>
    <div class="hist" id="hist"></div>
    <div class="me"><div class="av" id="av">J</div><div><div class="n" id="uname">Jackson</div><div class="m">Paket Gratis</div></div><button id="rename" aria-label="Ganti nama"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
  </aside>
  <main>
    <div class="top">
      <button class="ib" id="expand" hidden aria-label="Buka sidebar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <button class="pill" id="modelBtn"><span id="modelName">Lumi</span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="sp"></div>
      <button class="ib" id="more" aria-label="Opsi"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      <button class="ib" id="copylink" aria-label="Salin tautan"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3A4 4 0 0011 18.7l1-1"/></svg></button>
      <button class="ghost" id="exp"><span>Ekspor chat</span></button>
      <button class="solid" id="upgrade">Upgrade</button>
    </div>
    <div class="stage" id="stage"></div>
    <div id="sugWrap"></div>
    <div class="composer">
      <div class="box">
        <div class="files" id="pending"></div>
        <textarea id="input" rows="1" placeholder="Tanyakan apa saja…"></textarea>
        <div class="bar">
          <button class="chip" id="dr"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8.5 11h5M11 8.5v5"/></svg>Riset mendalam</button>
          <button class="ib" id="saved" aria-label="Prompt tersimpan"><svg class="i" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button>
          <button class="ib" id="mic" aria-label="Input suara"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
          <button class="chip sm" id="attach"><svg class="i" viewBox="0 0 24 24"><path d="M20 12l-8 8a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8"/></svg>Lampirkan file</button>
          <button class="send" id="send" disabled aria-label="Kirim"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </div>
    <div class="foot"><span>Lumi bisa keliru. Periksa kembali informasi penting.</span><div class="r"><button class="ib" id="theme" aria-label="Ganti tema"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></div>
    <input type="file" id="file" multiple hidden>
  </main>
</div>

<script>
/* ============================================================
   KONFIGURASI — Lumi AI Spesialis Desain Web & UI/UX
   ============================================================ */
const CONFIG = {
  endpoint: "/api/ai/chat",
  models: [
    { id: "claude-3-5-sonnet-20241022", label: "Lumi Pro (Sonnet 3.5)" },
    { id: "claude-3-5-haiku-20241022",  label: "Lumi Cepat (Haiku)" }
  ],
  system: `Kamu adalah LUMI AI, Spesialis Desain Web, UI/UX, Arsitektur Landing Page, dan Frontend Modern untuk ekosistem Runnerflo B2B.

KEAHLIAN & FOKUS UTAMA:
1. Perancangan UI/UX website, tata letak visual, spacing, typography, hierarki visual, dan skema warna harmonis.
2. Arsitektur Landing Page berkonversi tinggi (Hero Section, Value Proposition, Feature Grid, Social Proof, Testimonial, Pricing Table, CTA).
3. Desain komponen frontend modern (Clean semantic HTML, Tailwind CSS, Flexbox/Grid, animasi mikro, interaksi ramah mobile).
4. UX Audit & Review desain antarmuka web (kemudahan navigasi, readability, responsivitas HP/desktop).

GUARDRAIL KETAT:
- KAMU HANYA BOLEH MENJAWAB pertanyaan atau permintaan yang berhubungan dengan Desain Web, UI/UX, Landing Page, dan Komponen Frontend.
- JIKA PENGGUNA MEMINTA TUGAS DI LUAR DESAIN WEB (seperti resep makanan, surat dinas kedinasan, modul ajar kurikulum sekolah, naskah video TikTok umum, servis mesin, politik, dsb.):
  TOLAK DENGAN SANGAT SOPAN DAN RAMAH:
  "Maaf, saya Lumi didesain khusus sebagai Spesialis Desain Web, UI/UX & Landing Page. Saya hanya dapat membantu Anda dalam merancang tampilan website, struktur layout, wireframe, pemilihan palet warna, dan optimasi antarmuka digital. Apakah ada desain website atau landing page yang ingin kita diskusikan bersama?"
- Bahasa: Bahasa Indonesia yang profesional, hangat, inspiratif, dan terstruktur rapi.`
};

/* Satu-satunya fungsi yang berbicara dengan AI.
   Kirim: { model, system, messages:[{role,content}] } */
async function callClaude(messages, opts) {
  const endpoint = CONFIG.endpoint || "/api/ai/chat";
  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: opts.model || CONFIG.models[0].id,
        system: CONFIG.system,
        messages: messages.map(m => ({ role: m.role === "assistant" || m.role === "agent" ? "assistant" : "user", content: m.content }))
      }),
      signal: opts.signal
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => "");
      throw new Error("Server status " + res.status);
    }
    const data = await res.json();
    let txt = "";
    if (data.text) txt = data.text;
    else if (data.content && Array.isArray(data.content)) {
      txt = data.content.filter(b => b.type === "text").map(b => b.text).join("");
    }
    return txt || "Tanggapan telah diterima.";
  } catch (e) {
    return "Maaf, koneksi ke Claude AI sedang dipersiapkan. Pastikan `ANTHROPIC_API_KEY` telah disetel di Cloudflare Pages.\\n\\n*(Sebagai Spesialis Desain Web & UI/UX, Lumi siap membantu Anda setelah API key aktif!)*";
  }
}

/* ============================ STATE ============================ */
const $ = s => document.querySelector(s);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const S = {
  chats: load("lumi.chats", []), saved: load("lumi.saved", ["Ringkas teks ini menjadi 5 poin utama"]),
  files: load("lumi.files", []), name: load("lumi.name", "Jackson"), theme: load("lumi.theme", matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"),
  model: load("lumi.model", CONFIG.models[0].id), cur: null, view: "home", dr: false, pending: [], busy: false
};
const persist = () => { try {
  localStorage.setItem("lumi.chats", JSON.stringify(S.chats)); localStorage.setItem("lumi.saved", JSON.stringify(S.saved));
  localStorage.setItem("lumi.files", JSON.stringify(S.files)); localStorage.setItem("lumi.name", JSON.stringify(S.name));
  localStorage.setItem("lumi.theme", JSON.stringify(S.theme)); localStorage.setItem("lumi.model", JSON.stringify(S.model));
} catch {} };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chat = () => S.chats.find(c => c.id === S.cur);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function toast(t) { const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.append(e); setTimeout(() => e.remove(), 2200); }
function md(t) {
  let h = esc(t);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => "<pre><code>" + c + "</code></pre>");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(?:^|\n)((?:- .*(?:\n|$))+)/g, (_, b) => "<ul>" + b.trim().split("\n").map(l => "<li>" + l.slice(2) + "</li>").join("") + "</ul>");
  return h.replace(/\n(?!<\/?(ul|li|pre))/g, "<br>");
}
const ic = p => '<svg class="i" viewBox="0 0 24 24">' + p + "</svg>";

/* ============================ RENDER ============================ */
function renderSide() {
  const q = $("#q").value.toLowerCase(), now = Date.now(), day = 864e5;
  const list = S.chats.filter(c => c.title.toLowerCase().includes(q)).sort((a, b) => b.ts - a.ts);
  const groups = [["Hari ini", c => now - c.ts < day], ["Kemarin", c => now - c.ts >= day && now - c.ts < 2 * day], ["Sebelumnya", c => now - c.ts >= 2 * day]];
  let h = "";
  groups.forEach(([n, f]) => {
    const items = list.filter(f); if (!items.length) return;
    h += '<div class="grp">' + n + "</div>" + items.map(c => '<div class="item ' + (c.id === S.cur ? "on" : "") + '"><button class="t" data-open="' + c.id + '">' + esc(c.title) + '</button><button class="del" data-del="' + c.id + '" aria-label="Hapus">' + ic('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>') + "</button></div>").join("");
  });
  $("#hist").innerHTML = h || '<div class="empty">' + (q ? "Tidak ada hasil." : "Belum ada chat. Mulai percakapan pertama Anda.") + "</div>";
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === S.view && S.view !== "home" || (b.dataset.v === "home" && S.view === "home" && !S.cur)));
  $("#uname").textContent = S.name; $("#av").textContent = S.name[0].toUpperCase();
  $("#modelName").textContent = (CONFIG.models.find(m => m.id === S.model) || CONFIG.models[0]).label;
}
const SUGS = [
  ["Desain Landing Page", "Rancang struktur layout & hero section konversi tinggi.", "Rancang konsep dan struktur layout landing page untuk bisnis ", '<path d="M4 6h16M4 12h10M4 18h6"/>'],
  ["Audit UI/UX Website", "Analisis hierarki visual, warna, dan pengalaman pengguna.", "Tolong audit tampilan UI/UX dan berikan rekomendasi perbaikan untuk website ", '<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 00-4-10z"/>'],
  ["Rancang Komponen Web", "Buat ide tata letak komponen interaktif (Pricing & CTA).", "Buatkan rekomendasi tata letak komponen Pricing Table & CTA modern untuk ", '<path d="M5 12l5 5 9-10"/>']
];
function render() {
  renderSide();
  const st = $("#stage"), c = chat(), sw = $("#sugWrap");
  sw.innerHTML = "";
  if (S.view === "library") {
    st.innerHTML = '<div class="panel"><h2>Perpustakaan prompt</h2>' + (S.saved.map((p, i) => '<div class="row"><span class="tx">' + esc(p) + '</span><button class="chip" data-use="' + i + '">Pakai</button><button class="ib" data-rmsaved="' + i + '" aria-label="Hapus">' + ic('<path d="M6 6l12 12M18 6L6 18"/>') + "</button></div>").join("") || '<div class="empty">Belum ada prompt. Ketik prompt lalu tekan ikon penanda untuk menyimpannya.</div>') + "</div>"; return;
  }
  if (S.view === "files") {
    st.innerHTML = '<div class="panel"><h2>File terlampir</h2>' + (S.files.map(f => '<div class="row">' + ic('<path d="M7 3h7l5 5v13H7z"/>') + '<span class="tx">' + esc(f.name) + '</span><small>' + Math.ceil(f.size / 1024) + " KB</small></div>").join("") || '<div class="empty">Belum ada file. Gunakan “Lampirkan file” di kotak pesan.</div>') + "</div>"; return;
  }
  if (!c || !c.messages.length) {
    st.innerHTML = '<div class="home"><div class="orb"></div><h1><span>Lumi AI</span><br>Spesialis Desain Web &amp; UI/UX</h1><p style="color:var(--mut);margin-top:8px;font-size:13.5px">Konsultasi wireframe, arsitektur visual, desain komponen modern &amp; layout konversi tinggi.</p></div>';
    sw.innerHTML = '<div class="sug">' + SUGS.map((s, i) => '<button data-sug="' + i + '">' + ic(s[3]) + "<b>" + s[0] + "</b><small>" + s[1] + "</small></button>").join("") + "</div>";
    return;
  }
  st.innerHTML = '<div class="msgs">' + c.messages.map((m, i) => m.role === "user"
    ? '<div class="msg user"><div class="bub">' + esc(m.content) + "</div></div>"
    : '<div class="msg ai"><div class="mini"></div><div class="bub">' + md(m.content) + '<div class="acts"><button data-copy="' + i + '" aria-label="Salin">' + ic('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>') + "</button>" + (i === c.messages.length - 1 ? '<button data-regen aria-label="Buat ulang">' + ic('<path d="M20 11a8 8 0 10-2 6M20 5v6h-6"/>') + "</button>" : "") + "</div></div></div>").join("") +
    (S.busy ? '<div class="msg ai"><div class="mini"></div><div class="bub"><span class="dots"><i></i><i></i><i></i></span></div></div>' : "") + "</div>";
  st.scrollTop = st.scrollHeight;
}
function renderPending() {
  $("#pending").innerHTML = S.pending.map((f, i) => '<span class="chip">' + esc(f.name) + ' <button data-rmp="' + i + '" aria-label="Hapus">×</button></span>').join("");
}

/* ============================ AKSI ============================ */
function go(v) { S.view = v; if (v === "home") S.cur = null; render(); if (v === "history") $("#q").focus(); }
function newChat() { S.cur = null; S.view = "home"; render(); $("#input").focus(); }
async function send(text, regen) {
  text = (text ?? $("#input").value).trim();
  if ((!text && !S.pending.length && !regen) || S.busy) return;
  S.view = "chat";
  let c = chat();
  if (!c) { c = { id: uid(), title: "Chat baru", ts: Date.now(), messages: [] }; S.chats.push(c); S.cur = c.id; }
  if (!regen) {
    let body = text;
    S.pending.forEach(f => { if (f.text) body += "\n\n[File: " + f.name + "]\n" + f.text; else body += "\n\n[File terlampir: " + f.name + "]"; });
    c.messages.push({ role: "user", content: body });
    if (c.messages.length === 1) c.title = text.slice(0, 48) || S.pending[0].name;
    S.pending = []; renderPending(); $("#input").value = ""; autosize();
  }
  c.ts = Date.now(); S.busy = true; persist(); render();
  try {
    const reply = await callClaude(c.messages.map(m => ({ role: m.role, content: m.content })), { model: S.model, deepResearch: S.dr });
    c.messages.push({ role: "assistant", content: reply });
  } catch (e) {
    c.messages.push({ role: "assistant", content: "Permintaan gagal: " + e.message + "\n\nPeriksa `CONFIG.endpoint` dan pastikan server berjalan." });
  }
  S.busy = false; persist(); render();
}
function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; $("#send").disabled = !t.value.trim() && !S.pending.length; }
function closePop() { document.querySelectorAll(".pop").forEach(p => p.remove()); }
function pop(anchor, items) {
  closePop(); const p = document.createElement("div"); p.className = "pop";
  items.forEach(([l, fn]) => { const b = document.createElement("button"); b.textContent = l; b.onclick = () => { closePop(); fn(); }; p.append(b); });
  const r = anchor.getBoundingClientRect(), m = $("main").getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(r.left - m.left, m.width - 210)) + "px"; p.style.top = (r.bottom - m.top + 6) + "px";
  if (anchor.id === "saved") { p.style.top = ""; p.style.bottom = (m.bottom - r.top + 6) + "px"; }
  $("main").append(p); setTimeout(() => document.addEventListener("click", closePop, { once: true }));
}
function exportChat() {
  const c = chat(); if (!c) return toast("Belum ada chat untuk diekspor");
  const t = "# " + c.title + "\n\n" + c.messages.map(m => "**" + (m.role === "user" ? S.name : "Lumi") + ":**\n" + m.content).join("\n\n---\n\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/markdown" })); a.download = c.title.replace(/[^\w-]+/g, "_") + ".md"; a.click();
}
function applyTheme() { document.documentElement.dataset.theme = S.theme; }

/* ============================ EVENT ============================ */
$("#new").onclick = newChat;
$("#q").oninput = renderSide;
$("#collapse").onclick = () => { $("#app").classList.add("collapsed"); $("#expand").hidden = false; };
$("#expand").onclick = () => { $("#app").classList.remove("collapsed"); $("#expand").hidden = true; };
document.querySelector("nav").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.v); };
$("#hist").onclick = e => {
  const o = e.target.closest("[data-open]"), d = e.target.closest("[data-del]");
  if (o) { S.cur = o.dataset.open; S.view = "chat"; render(); }
  if (d) { S.chats = S.chats.filter(c => c.id !== d.dataset.del); if (S.cur === d.dataset.del) { S.cur = null; S.view = "home"; } persist(); render(); }
};
$("#stage").onclick = e => {
  const cp = e.target.closest("[data-copy]"), rg = e.target.closest("[data-regen]"), u = e.target.closest("[data-use]"), r = e.target.closest("[data-rmsaved]");
  if (cp) { navigator.clipboard?.writeText(chat().messages[cp.dataset.copy].content); toast("Tersalin"); }
  if (rg) { const c = chat(); c.messages.pop(); send("", true); }
  if (u) { S.view = "home"; S.cur = null; render(); $("#input").value = S.saved[u.dataset.use]; autosize(); $("#input").focus(); }
  if (r) { S.saved.splice(r.dataset.rmsaved, 1); persist(); render(); }
};
$("#sugWrap").onclick = e => { const b = e.target.closest("[data-sug]"); if (b) { $("#input").value = SUGS[b.dataset.sug][2]; autosize(); $("#input").focus(); } };
$("#input").oninput = autosize;
$("#input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
$("#send").onclick = () => send();
$("#dr").onclick = () => { S.dr = !S.dr; $("#dr").classList.toggle("on", S.dr); toast(S.dr ? "Riset mendalam aktif" : "Riset mendalam nonaktif"); };
$("#saved").onclick = e => {
  e.stopPropagation(); const items = S.saved.map(p => [p.slice(0, 40), () => { $("#input").value = p; autosize(); $("#input").focus(); }]);
  items.push(["＋ Simpan teks saat ini", () => { const v = $("#input").value.trim(); if (!v) return toast("Ketik prompt dulu"); S.saved.push(v); persist(); toast("Prompt disimpan"); }]);
  pop(e.currentTarget, items);
};
$("#attach").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  for (const f of e.target.files) {
    const isText = f.type.startsWith("text/") || /\.(md|json|csv|js|ts|py|html|css|txt)$/i.test(f.name);
    S.pending.push({ name: f.name, size: f.size, text: isText && f.size < 200000 ? await f.text() : null });
    S.files.push({ name: f.name, size: f.size });
  }
  e.target.value = ""; persist(); renderPending(); autosize();
};
$("#pending").onclick = e => { const b = e.target.closest("[data-rmp]"); if (b) { S.pending.splice(b.dataset.rmp, 1); renderPending(); autosize(); } };
$("#mic").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return toast("Browser tidak mendukung input suara");
  const r = new SR(); r.lang = "id-ID"; r.onresult = ev => { $("#input").value += ev.results[0][0].transcript; autosize(); }; r.onerror = () => toast("Mikrofon tidak dapat diakses"); r.start(); toast("Mendengarkan…");
};
$("#modelBtn").onclick = e => { e.stopPropagation(); pop(e.currentTarget, CONFIG.models.map(m => [m.label, () => { S.model = m.id; persist(); renderSide(); }])); };
$("#more").onclick = e => {
  e.stopPropagation();
  pop(e.currentTarget, [["Ganti nama chat", () => { const c = chat(); if (!c) return toast("Belum ada chat"); const n = prompt("Nama chat:", c.title); if (n) { c.title = n; persist(); renderSide(); } }],
    ["Kosongkan chat", () => { const c = chat(); if (c) { c.messages = []; persist(); render(); } }],
    ["Hapus semua riwayat", () => { if (confirm("Hapus semua chat?")) { S.chats = []; S.cur = null; S.view = "home"; persist(); render(); } }]]);
};
$("#copylink").onclick = () => { navigator.clipboard?.writeText(location.href); toast("Tautan disalin"); };
$("#exp").onclick = exportChat;
$("#upgrade").onclick = () => toast("Sambungkan halaman pembayaran Anda di sini");
$("#rename").onclick = () => { const n = prompt("Nama Anda:", S.name); if (n && n.trim()) { S.name = n.trim(); persist(); render(); } };
$("#theme").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; applyTheme(); persist(); };

applyTheme(); render(); autosize();
</script>
</body>
</html>
