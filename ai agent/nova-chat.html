<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova AI – Konsultan B2B Lead Gen & Pertumbuhan Bisnis</title>
<style>
:root{--bg:#eef1f7;--surface:#fff;--soft:#f6f8fc;--line:#e4e8f1;--text:#161a2b;--mute:#7a8399;--brand:#2b5cf0;--brand-soft:#e8eefe;--err:#c62f3b;--shadow:0 10px 40px rgba(40,60,120,.10)}
:root[data-theme="dark"]{--bg:#0d1019;--surface:#161a27;--soft:#1b2030;--line:#262c3f;--text:#eef1fa;--mute:#8b94ad;--brand:#6b8cff;--brand-soft:#1f2848;--err:#ff7a85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1019;--surface:#161a27;--soft:#1b2030;--line:#262c3f;--text:#eef1fa;--mute:#8b94ad;--brand:#6b8cff;--brand-soft:#1f2848;--err:#ff7a85}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden}
button,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{position:relative;width:100%;height:100%;background:var(--surface);display:flex;overflow:hidden}
.side{width:68px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;flex-shrink:0}
.logo{width:32px;height:32px;margin-bottom:12px}
.nav{width:52px;border:0;background:none;border-radius:10px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:9px}
.nav svg,.ib svg,.pill svg,.send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav.on{background:var(--brand-soft);color:var(--brand)}.nav:hover{background:var(--soft)}.nav.on:hover{background:var(--brand-soft)}
.sp{flex:1}
.main{position:relative;flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px}
.top h1{font-size:15px;font-weight:600;margin:0}
.tr{display:flex;align-items:center;gap:10px}
.ib{border:0;background:none;padding:5px;border-radius:8px;color:var(--mute);display:flex;align-items:center;gap:4px}
.ib:hover{background:var(--soft)}.ib svg{width:16px;height:16px}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f3b58a,#c4673c)}
.bar{margin:0 22px;display:flex;gap:10px;align-items:center}
.hello{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);min-width:0}
.hello svg{width:18px;height:18px;flex-shrink:0}.hello span{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:12.5px;white-space:nowrap}
.pill svg{width:13px;height:13px;stroke-width:2;color:var(--mute)}
select.pill{appearance:none;-webkit-appearance:none}
.stage{flex:1;min-height:0;overflow:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;padding:0 22px}.stage.chat{overflow-y:auto}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 0;gap:6px}
.orb{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--brand-soft) 0%,transparent 70%);margin-bottom:6px}
.orb svg{width:38px;height:38px}
.empty h2{margin:0;font-size:17px;font-weight:600}.empty p{margin:0;color:var(--mute);font-size:13px}
.msgs{display:flex;flex-direction:column;gap:14px;padding:18px 0;max-width:760px;width:100%;margin:0 auto}
.m{max-width:85%;padding:10px 14px;border-radius:14px;font-size:13.5px;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.m.a{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.err{align-self:flex-start;color:var(--err);border:1px solid var(--err);background:transparent;border-bottom-left-radius:4px}
.m.a h4{margin:10px 0 4px;font-size:14px}.m.a ul,.m.a ol{margin:4px 0;padding-left:20px}
.m.a code{background:var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
.m.a a{color:var(--brand)}
.code{position:relative;margin:8px 0}.code pre{margin:0;background:#12162a;color:#e6e9f5;border-radius:10px;padding:12px;overflow-x:auto;font-size:12px}
.code code{background:none;padding:0;color:inherit}
.cp,.cpm{border:0;background:var(--line);color:var(--text);border-radius:6px;font-size:11px;padding:2px 8px}
.code .cp{position:absolute;top:6px;right:6px;background:#2a3050;color:#dfe4f7}
.acts{margin-top:6px}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.att img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.tag{background:rgba(255,255,255,.2);border-radius:8px;padding:3px 8px;font-size:11.5px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;width:100%;margin:0 auto;padding:0 22px 14px}
.card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;display:flex;gap:9px;align-items:flex-start}
.card:hover{border-color:var(--brand)}
.ci{width:22px;height:22px;border-radius:6px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.ci svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card b{display:block;font-size:12px}.card small{display:block;color:var(--mute);font-size:10.5px;line-height:1.35}
.inp{margin:0 auto 18px;max-width:760px;width:calc(100% - 44px);border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--surface);box-shadow:0 2px 10px rgba(40,60,120,.05)}
.inp:focus-within{border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 8px}.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 4px;max-width:210px;font-size:12px}
.chip .th{width:32px;height:32px;border-radius:7px;background:var(--brand-soft);display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.chip .th img{width:100%;height:100%;object-fit:cover}
.chip span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;color:var(--mute);font-size:15px;line-height:1;padding:0 2px}
.row{display:flex;align-items:flex-end;gap:6px}
.row textarea{flex:1;border:0;outline:0;background:none;resize:none;padding:7px 4px;max-height:140px;min-height:34px;line-height:1.5;color:var(--text)}
.row textarea::placeholder{color:var(--mute)}
.send{border:0;background:var(--brand);color:#fff;border-radius:9px;padding:8px 14px;display:flex;gap:6px;align-items:center;font-size:12.5px;height:34px}
.send svg{width:13px;height:13px;stroke:#fff;stroke-width:2}.send:disabled{opacity:.5;cursor:default}
.drawer{position:absolute;top:0;right:0;bottom:0;width:300px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:5;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:6px;padding:14px;border-bottom:1px solid var(--line)}.dh b{flex:1}
#hlist{overflow-y:auto;padding:8px;flex:1}
.hi{display:flex;align-items:center;gap:6px;border-radius:10px;padding:8px 10px;cursor:pointer}
.hi:hover,.hi.on{background:var(--soft)}.hi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.hi button{border:0;background:none;color:var(--mute)}
.none{color:var(--mute);text-align:center;padding:24px;font-size:13px}
.dz{position:absolute;inset:0;background:color-mix(in srgb,var(--brand) 14%,transparent);border:2px dashed var(--brand);display:none;place-items:center;font-weight:600;color:var(--brand);z-index:9}
.dz.on{display:grid}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:13px;z-index:20;max-width:90%}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
body{overscroll-behavior:none}
.empty{user-select:none;-webkit-user-select:none}.orb svg{pointer-events:none}
.nav{position:relative}
.badge{position:absolute;top:2px;right:4px;background:var(--err);color:#fff;border-radius:9px;font-size:9px;font-style:normal;padding:0 5px;min-width:16px;text-align:center}
.view{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.pg{flex:1;overflow-y:auto;padding:6px 22px 24px;max-width:760px;width:100%;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.stat b{display:block;font-size:22px}.stat small{color:var(--mute)}
.pg h3{font-size:13px;color:var(--mute);margin:16px 0 8px;font-weight:600}
.add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.add input,.fld input,.fld select,.sbox{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;outline:0}
.add input{flex:1;min-width:140px}.add input:focus,.fld input:focus,.fld select:focus,.sbox:focus{border-color:var(--brand)}
.btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 14px;font-size:13px}.btn.s{padding:6px 10px;font-size:12px}.btn.ghost{background:var(--soft);color:var(--text);border:1px solid var(--line)}
.li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.li[data-act="open"],.li[data-act="readn"],.li[data-act="gop"],.li[data-act="got"]{cursor:pointer}.li[data-act]:hover{background:var(--soft)}
.li.un{border-left:3px solid var(--brand)}
.gr{flex:1;min-width:0;overflow-wrap:anywhere}.gr small{display:block;color:var(--mute);font-size:12px}
label.gr{display:flex;align-items:center;gap:10px}
.x{border:0;background:none;color:var(--mute)}
.dn{text-decoration:line-through;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 12px;font-size:12px;text-transform:capitalize}.tab.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.fld{display:block;margin-bottom:12px}.fld span{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}.fld input,.fld select{width:100%}
.sbox{width:100%;margin-bottom:6px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.app{flex-direction:column-reverse}.side{width:100%;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px;justify-content:space-around}.logo,.sp{display:none}.cards{grid-template-columns:repeat(2,1fr)}.bar{flex-wrap:wrap}.hello{flex-basis:100%}.m{max-width:94%}}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="side" aria-label="Main">
    <svg class="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#2b5cf0"/><path d="M16 6l2.4 7.6L26 16l-7.6 2.4L16 26l-2.4-7.6L6 16l7.6-2.4z" fill="#fff"/></svg>
    <button class="nav" data-v="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</button>
    <button class="nav" data-v="projects"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16"/></svg>Projects</button>
    <button class="nav" data-v="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Task</button>
    <button class="nav on" data-v="chat"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Ask AI</button>
    <button class="nav" data-v="notif"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/></svg>Alerts<i class="badge" id="nbadge" hidden>0</i></button>
    <button class="nav" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Settings</button>
    <div class="sp"></div>
    <button class="nav" data-v="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Search</button>
  </nav>

  <section class="main">
<div class="view" id="v-chat">
    <header class="top">
      <h1>Nova AI — Konsultan B2B Growth</h1>
      <div class="tr">
        <button class="ib" id="newbtn" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="av" role="img" aria-label="Profile"></div>
      </div>
    </header>

    <div class="bar">
      <div class="hello"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#2b5cf0"/><path d="M16 6l2.4 7.6L26 16l-7.6 2.4L16 26l-2.4-7.6L6 16l7.6-2.4z" fill="#fff"/></svg><span>Halo, saya Nova. Konsultan Lead Gen &amp; Pertumbuhan B2B Anda.</span></div>
      <select class="pill" id="role" aria-label="Role"><option>B2B Strategist</option><option>Lead Gen Specialist</option><option>Pitching &amp; Sales Closer</option></select>
      <button class="pill" id="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Riwayat</button>
    </div>

    <div class="stage" id="stage">
      <div class="empty" id="empty">
        <div class="orb"><svg viewBox="0 0 32 32"><path d="M16 4l3.2 9.8L29 17l-9.8 3.2L16 30l-3.2-9.8L3 17l9.8-3.2z" fill="#2b5cf0"/></svg></div>
        <h2>Nova AI — B2B Growth &amp; Lead Gen</h2>
        <p>Konsultasikan target akuisisi klien B2B, cold email outreach, skrip pitching, dan penawaran retainer bernilai tinggi.</p>
      </div>
      <div class="msgs" id="msgs" hidden></div>
    </div>

    <div class="cards" id="cards"></div>

    <form class="inp" id="form">
      <div class="chips" id="chips"></div>
      <div class="row">
        <button class="ib" type="button" id="attach" aria-label="Attach files"><svg viewBox="0 0 24 24"><path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg></button>
        <textarea id="q" rows="1" placeholder="Konsultasikan strategi B2B, lead gen, atau pitching Anda di sini…" aria-label="Message"></textarea>
        <button class="send" id="send" type="submit"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg><span id="sl">Send</span></button>
      </div>
      <input type="file" id="file" multiple hidden>
    </form>

</div>
<div class="view" id="v-home" hidden></div>
<div class="view" id="v-projects" hidden></div>
<div class="view" id="v-tasks" hidden></div>
<div class="view" id="v-notif" hidden></div>
<div class="view" id="v-settings" hidden></div>
<div class="view" id="v-search" hidden></div>
    <aside class="drawer" id="drawer" aria-label="History">
      <div class="dh"><b>History</b><button class="ib" id="dnew">New chat</button><button class="ib" id="dclose" aria-label="Close">✕</button></div>
      <div id="hlist"></div>
    </aside>
  </section>
  <div class="dz" id="dz">Drop files to attach</div>
</div>

<script>
/* ============ CONFIG: isi di sini ============ */
const CONFIG = {
  API_KEY: "",
  PROXY_URL: "/api/ai/chat",                  // Cloudflare Pages Function proxy
  MODEL: "claude-3-5-sonnet-20241022",
  MAX_TOKENS: 4096,
  VIDEO_FRAMES: 6,                         // jumlah frame yang diambil dari video
  MAX_FILE_MB: 30
};
/* ============================================= */

const $ = id => document.getElementById(id);
const get = (k, d) => { try { const v = localStorage.getItem("nova." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const put = (k, v) => { try { localStorage.setItem("nova." + k, JSON.stringify(v)); } catch (e) {} };
function applyTheme(t) { if (t && t !== "auto") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
Object.assign(CONFIG, get("settings", {}));
CONFIG.PROXY_URL = "/api/ai/chat";
applyTheme(CONFIG.theme);
const ROLES = {"B2B Strategist":"B2B growth strategy and market expansion","Lead Gen Specialist":"outbound B2B lead generation and outreach","Pitching & Sales Closer":"B2B sales pitching and client closing"};
const SUG = [
 ["Cold Outreach B2B","Buatkan 3-step cold email sequence bernilai tinggi untuk direktur operasional"],
 ["Pitching Penawaran","Susun skrip pitching meeting 15 menit penawaran jasa B2B korporat"],
 ["Pemetaan ICP","Bagaimana cara memetakan profil klien ideal (ICP) dengan tiket transaksi tinggi?"],
 ["Keberatan Harga","Berikan framework menjawab keberatan harga mahal dari calon klien B2B"],
 ["Pesan LinkedIn","Buatkan draf pesan koneksi LinkedIn yang personal tanpa terkesan spam"],
 ["Kontrak Retainer","Bagaimana menyusun struktur penawaran kontrak bulanan (retainer) yang menarik?"]
];
const IC = ["M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z","M3 7h18v10H3zM3 11h18","M12 8v5M12 16h.01M4 20h16L12 4z","M8 8l-4 4 4 4M16 8l4 4-4 4","M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM5 20a7 7 0 0 1 14 0","M6 4h12v16H6zM9 9h6M9 13h6"];

let chats = [], chat = null, pending = [], busy = false, ctrl = null;
try { chats = JSON.parse(localStorage.getItem("nova.chats") || "[]"); } catch (e) {}
function save() {
  try { localStorage.setItem("nova.chats", JSON.stringify(chats.slice(0,40).map(c => ({id:c.id,title:c.title,role:c.role,t:c.t,msgs:c.msgs.map(m => ({role:m.role,text:m.text,files:m.files}))})))); } catch (e) {}
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }

/* ---------- markdown ---------- */
function md(s) {
  const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inl = t => t.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const codes = [];
  s = s.replace(/```[\w+-]*\n?([\s\S]*?)(```|$)/g, (_, c) => { codes.push('<div class="code"><button class="cp" type="button">Copy</button><pre><code>' + esc(c.replace(/\n$/,"")) + '</code></pre></div>'); return "\u0000" + (codes.length-1) + "\u0000"; });
  const out = []; let list = "";
  const close = () => { if (list) { out.push("</" + list + ">"); list = ""; } };
  esc(s).split("\n").forEach(line => {
    let m;
    if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + inl(m[1]) + "</li>"); }
    else if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + inl(m[1]) + "</li>"); }
    else { close(); if ((m = line.match(/^#{1,4}\s+(.*)/))) out.push("<h4>" + inl(m[1]) + "</h4>"); else if (/^\u0000\d+\u0000$/.test(line)) out.push(line); else if (line.trim()) out.push(inl(line) + "<br>"); }
  });
  close();
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => codes[i]);
}

/* ---------- render ---------- */
function draw(m) {
  const el = document.createElement("div");
  if (m.role === "user") {
    el.className = "m u";
    if ((m.thumbs && m.thumbs.length) || (m.files && m.files.length)) {
      const a = document.createElement("div"); a.className = "att";
      (m.thumbs || []).forEach(u => { const i = document.createElement("img"); i.src = u; i.alt = ""; a.appendChild(i); });

  else if (a === "askp") { const p = projects.find(same); show("chat"); newChat(); $("q").value = 'Help me with my project "' + p.name + '"' + (p.desc ? ": " + p.desc : "") + ". "; grow(); $("q").focus(); }
  else if (a === "delp") { projects = projects.filter(x => !same(x)); put("projects", projects); renderView("projects"); }
  else if (a === "delt") { tasks = tasks.filter(x => !same(x)); put("tasks", tasks); renderView("tasks"); }
  else if (a === "tog") { const t = tasks.find(same); t.done = !t.done; put("tasks", tasks); renderView("tasks"); }
  else if (a === "filt") { tf = id; renderView("tasks"); }
  else if (a === "readn") { const n = notes.find(same); if (n) n.read = true; put("notes", notes); badge(); renderView("notif"); }
  else if (a === "readall") { notes.forEach(n => n.read = true); put("notes", notes); badge(); renderView("notif"); }
  else if (a === "clearn") { notes = []; put("notes", notes); badge(); renderView("notif"); }
  else if (a === "clearh") { if (confirm("Delete all chat history?")) { chats = []; save(); newChat(); toast("History deleted"); } }
});
newChat();
badge();
</script>
</body>
</html>
