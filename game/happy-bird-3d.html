<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../security-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Bird 3D</title>
<style>
:root{--bg:#e8b890;--ink:#fff;--panel:rgba(18,26,38,.5);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2230}}
:root[data-theme="dark"]{--bg:#2a2230}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#sc{font-size:min(16vw,92px);font-weight:900;line-height:1;text-shadow:0 4px 18px rgba(40,20,0,.55);letter-spacing:-.02em}
#card{margin:auto;text-align:center;padding:22px 30px;border-radius:18px;background:var(--panel);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:min(90vw,560px);box-sizing:border-box}
#card h1{margin:0 0 6px;font-size:clamp(24px,6vw,40px)}
#card p{margin:4px 0;font-size:15px;opacity:.92}
#card{pointer-events:auto}#wl{margin-top:6px;font-weight:700;font-size:15px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#btns button{font:inherit;font-weight:700;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:12px;padding:10px 18px;min-height:44px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#btns button:hover{background:rgba(255,255,255,.3)}
.pop{position:fixed;left:50%;top:36%;transform:translateX(-50%);font-weight:900;font-size:clamp(20px,5vw,34px);color:#ffe27a;text-shadow:0 3px 12px rgba(0,0,0,.65);pointer-events:none;white-space:nowrap;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(-50%,-70px);opacity:0}}
#cp{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:6px;z-index:5;width:104px}
#cp button{font:inherit;font-size:13px;font-weight:700;color:#fff;background:rgba(18,26,38,.55);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 8px;cursor:pointer;min-height:36px;touch-action:manipulation}
#cp button:hover{background:rgba(18,26,38,.8)}#cp button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#cp .r{display:flex;gap:6px}#cp .r button{flex:1}
#cp,#glbIn{display:none}
#vg{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 170px 40px rgba(220,0,0,.8);z-index:3}
#cb{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);z-index:6}
#cb,#cs button{font:inherit;font-weight:700;font-size:14px;color:#fff;background:rgba(18,26,38,.6);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:38px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#cb:hover,#cs button:hover{background:rgba(18,26,38,.85)}#cs button.on{background:rgba(255,255,255,.3)}
#cs{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:min(92vw,440px);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;border-radius:18px;background:rgba(14,20,30,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-sizing:border-box}
#cs[hidden]{display:none}#cs h2{margin:0 0 8px;font-size:22px}#cs section{margin:12px 0;padding-top:10px;border-top:1px solid rgba(255,255,255,.2)}
.chips,.rowb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
#cs input[type=color]{width:42px;height:30px;border:none;background:none;vertical-align:middle}
#hp{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 14px);font-size:24px;font-weight:900;color:#ff5a7a;text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:4;pointer-events:none;letter-spacing:2px}
#bh{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:min(72vw,380px);display:none;z-index:4;pointer-events:none;text-align:center;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#fx{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5}
#cs .chips button{padding:4px}#cs .chips img{display:block;width:64px;height:64px;border-radius:8px;background:rgba(255,255,255,.1)}#cs .chips button.on{outline:2px solid #ffe27a}
.pv{width:64px;height:64px;border-radius:8px;background:rgba(255,255,255,.1)}
:root{--ps:#0070d1;--psg:rgba(0,112,209,.55)}
#card{background:linear-gradient(180deg,rgba(10,16,28,.74),rgba(6,10,18,.84));border:1px solid rgba(255,255,255,.14);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:26px 34px;font-weight:300;letter-spacing:.04em}
#card h1{font-weight:300;letter-spacing:.18em;text-transform:uppercase;font-size:clamp(20px,4.5vw,30px)}#card p{opacity:.82}
#btns button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:3px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;font-size:14px;transition:all .15s}
#btns button:hover,#btns button:focus-visible{background:linear-gradient(90deg,var(--psg),rgba(0,112,209,.1));border-color:var(--ps);box-shadow:0 0 22px var(--psg);outline:none;transform:translateX(4px)}
#card.menu{position:fixed;left:max(5vw,24px);bottom:calc(7vh + 240px);margin:0;max-width:min(90vw,560px);text-align:left;background:none;border:none;box-shadow:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
#card.menu h1{font-size:clamp(30px,6vw,72px);font-weight:200;letter-spacing:.2em;line-height:1.02;background:linear-gradient(180deg,#fff 30%,#9fc4ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
#card.menu h1::after{content:'';display:block;width:120px;height:3px;margin-top:16px;background:var(--ps);box-shadow:0 0 18px var(--ps)}
#card.menu #btns{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:6px;margin-top:20px}
#card.menu #btns button{min-width:0;text-align:left;padding:12px 20px;font-size:clamp(14px,2.2vw,18px);font-weight:300;border:none;border-left:3px solid transparent;background:rgba(255,255,255,.05);border-radius:0}
#card.menu #btns button:nth-child(n+4){grid-column:1/-1}
#card.menu #btns button:last-child{background:linear-gradient(90deg,var(--ps),rgba(0,112,209,.4));font-weight:500}
#card.menu #btns button:hover,#card.menu #btns button:focus-visible{border-left-color:var(--ps)}
#mv{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(4,8,16,.88),rgba(4,8,16,.4) 55%,rgba(4,8,16,0));opacity:0;transition:opacity .5s}#mv.on{opacity:1}
#hint{position:fixed;left:max(5vw,24px);bottom:3.5vh;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.65;z-index:4;pointer-events:none}
#cb{border-radius:3px;letter-spacing:.2em;text-transform:uppercase;font-size:12px;font-weight:400}
#cs{border-radius:6px;border:1px solid rgba(255,255,255,.14);background:rgba(8,12,22,.94)}#cs h2{font-weight:300;letter-spacing:.3em;text-transform:uppercase;font-size:18px}
#cs section b{font-weight:400;letter-spacing:.25em;text-transform:uppercase;font-size:12px;opacity:.8}#cs .chips button.on{outline:2px solid var(--ps);box-shadow:0 0 18px var(--psg)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.55) 100%)}
#grain{position:fixed;inset:-60px;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:var(--gr);animation:gr .5s steps(5) infinite}
@keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-30px,20px)}50%{transform:translate(25px,-35px)}75%{transform:translate(-20px,-15px)}100%{transform:translate(0,0)}}
#ld{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;width:min(88vw,380px);padding:20px 22px;border-radius:6px;background:rgba(8,12,22,.95);border:1px solid rgba(255,255,255,.18);text-align:center;box-sizing:border-box}
#ld[hidden]{display:none}#ld .lt{font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
#ld .lb{height:6px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden;margin:14px 0 8px}#ld .lb i{display:block;height:100%;width:0;background:var(--ps);box-shadow:0 0 12px var(--ps);transition:width .2s}
#ld.ind .lb i{width:35%!important;animation:ind 1s ease-in-out infinite alternate}@keyframes ind{from{margin-left:0}to{margin-left:65%}}
#ld .lm{font-size:13px;opacity:.85;min-height:1.2em;line-height:1.4}#ld.err .lt{color:#ff6070}#ld.err .lb{display:none}
#ld button{font:inherit;margin-top:10px;padding:8px 22px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:3px;cursor:pointer;min-height:38px}#ld button[hidden]{display:none}
#sg{position:fixed;left:0;right:0;bottom:7vh;z-index:5;padding:0 max(5vw,24px)}#sg[hidden]{display:none}
#sg h2{font-weight:300;letter-spacing:.3em;text-transform:uppercase;font-size:clamp(16px,3vw,24px);margin:0 0 6px}
#sg .tl{display:flex;gap:14px;overflow-x:auto;padding:14px 4px 18px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
#sg .tl button{flex:0 0 clamp(150px,22vw,250px);scroll-snap-align:start;padding:0;border:2px solid rgba(255,255,255,.18);border-radius:6px;overflow:hidden;background:rgba(8,12,22,.8);color:#fff;font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;text-align:left;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#sg .tl img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#101826}
#sg .tl span{display:block;padding:8px 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
#sg .tl button.on{border-color:var(--ps);box-shadow:0 0 26px var(--psg)}
#sg .tl button:hover,#sg .tl button:focus-visible{outline:none;border-color:var(--ps);box-shadow:0 0 26px var(--psg);transform:translateY(-6px) scale(1.03)}
#sg .bk{font:inherit;padding:8px 20px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);border-radius:3px;letter-spacing:.14em;text-transform:uppercase;font-size:12px;cursor:pointer}
#bh b{display:block;font-size:14px;margin-bottom:4px}#bh i{display:block;height:12px;border-radius:8px;background:#e23a4a;box-shadow:0 0 0 2px rgba(255,255,255,.7);transition:width .3s}#btns button:focus-visible{outline:2px solid #fff;outline-offset:2px}

@media (max-width: 640px){
  #card.menu{
    position: fixed;
    left: max(16px, env(safe-area-inset-left, 16px));
    right: max(16px, env(safe-area-inset-right, 16px));
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    bottom: auto;
    max-width: 100%;
  }
  #card.menu h1{ font-size: clamp(24px, 7vw, 42px); margin-bottom: 4px; }
  #card.menu h1::after{ margin-top: 8px; width: 80px; }
  #card.menu p{ font-size: 13px; margin: 2px 0; }
  #card.menu #btns{ grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  #card.menu #btns button{ padding: 8px 6px; font-size: 13px; text-align: center; min-height: 40px; }
  #sg{ bottom: max(12px, env(safe-area-inset-bottom, 12px)); padding: 0 16px; }
  #sg .tl{ padding: 6px 2px 10px; gap: 8px; }
  #sg .tl button{ flex: 0 0 130px; }
  #sg .tl span{ padding: 6px 8px; font-size: 11px; }
  #hint{ display: none; }
}
@media (max-height: 500px){
  #card.menu{
    position: fixed;
    left: max(16px, env(safe-area-inset-left, 16px));
    top: calc(env(safe-area-inset-top, 0px) + 6px);
    bottom: auto;
    max-width: 50vw;
  }
  #card.menu h1{ font-size: 22px; margin-bottom: 2px; }
  #card.menu h1::after{ display: none; }
  #card.menu p{ display: none; }
  #card.menu #btns{ margin-top: 6px; gap: 4px; }
  #card.menu #btns button{ padding: 6px 8px; font-size: 11px; min-height: 32px; }
  #sg{ bottom: max(6px, env(safe-area-inset-bottom, 6px)); }
  #sg h2{ font-size: 14px; margin-bottom: 2px; }
  #sg .tl{ padding: 4px 2px 6px; gap: 8px; }
  #sg .tl button{ flex: 0 0 110px; }
  #sg .tl span{ padding: 4px 6px; font-size: 10px; }
  #hint{ display: none; }
}
</style>
</head>
<body>
<div id="hud"><div id="sc">0</div><div id="wl"></div>
<div id="card"><h1 id="t">Flappy Bird</h1><p id="s">Tap, click, or press Space to fly</p><p id="b"></p><div id="btns"></div></div></div>
<div id="cp"><button id="cUp">Character GLB</button><div class="r"><button id="cRot" title="Rotate 90 degrees">Rotate</button></div><div class="r"><button id="cBig" title="Enlarge">+</button><button id="cSm" title="Shrink">-</button></div><button id="cReset">Use bird</button></div>
<input type="file" id="glbIn" accept=".glb" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
<script>
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.outputEncoding=THREE.sRGBEncoding;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(R.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,.1,300);
const FOG=0xe8b890;
scene.fog=new THREE.Fog(FOG,35,150);

function tex(w,h,fn,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  if(srgb)t.encoding=THREE.sRGBEncoding;
  t.anisotropy=R.capabilities.getMaxAnisotropy();
  return t;
}
const rnd=(a,b)=>a+Math.random()*(b-a);

// Sky
scene.background=tex(4,512,(x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#2f5a96');g.addColorStop(.45,'#86a9cc');g.addColorStop(.72,'#f0b98a');g.addColorStop(1,'#f7c88c');
  x.fillStyle=g;x.fillRect(0,0,w,h);
});

// Lights
const hemi=new THREE.HemisphereLight(0xa5c4e4,0x5a6b3a,.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd0a0,2.3);
sun.position.set(-6,26,16);sun.target.position.set(8,0,0);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:80});
sun.shadow.bias=-.0005;sun.shadow.normalBias=.03;
scene.add(sun,sun.target);

// Ground
let gTex=tex(512,512,(x,w,h)=>{
  x.fillStyle='#587a2c';x.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){
    x.strokeStyle=`hsl(${rnd(70,105)},${rnd(35,60)}%,${rnd(18,42)}%)`;
    const px=rnd(0,w),py=rnd(0,h);x.beginPath();x.moveTo(px,py);x.lineTo(px+rnd(-3,3),py-rnd(3,10));x.stroke();
  }
});
gTex.wrapS=gTex.wrapT=THREE.RepeatWrapping;gTex.repeat.set(50,13);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,80),
  new THREE.MeshStandardMaterial({map:gTex,bumpMap:gTex,bumpScale:3,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.z=-20;ground.receiveShadow=true;scene.add(ground);

// Distant hills
const hillMat=new THREE.MeshStandardMaterial({color:0x4d6a5e,roughness:1});
for(let i=0;i<9;i++){
  const h=new THREE.Mesh(new THREE.SphereGeometry(1,24,12),hillMat);
  h.scale.set(rnd(22,40),rnd(8,18),10);h.position.set(-120+i*30,-3,-85);scene.add(h);
}

// Clouds
const clouds=[];const cMat=new THREE.MeshStandardMaterial({color:0xfff4e6,roughness:1,emissive:0xf2b98d,emissiveIntensity:.25});
for(let i=0;i<9;i++){
  const g=new THREE.Group();
  for(let j=0;j<5;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(rnd(2.5,4.5),14,10),cMat);s.position.set(j*3.2-6,rnd(-.8,.8),rnd(-1,1));s.scale.y=.6;g.add(s)}
  g.position.set(rnd(-60,60),rnd(17,28),rnd(-45,-25));scene.add(g);clouds.push(g);
}

// Pipes
const pTex=tex(256,256,(x,w,h)=>{
  x.fillStyle='#3f9a30';x.fillRect(0,0,w,h);
  for(let i=0;i<260;i++){x.fillStyle=`rgba(${rnd(10,60)|0},${rnd(60,150)|0},${rnd(10,50)|0},.18)`;x.fillRect(rnd(0,w),0,rnd(1,6),h)}
  for(let i=0;i<2500;i++){x.fillStyle=Math.random()<.5?'rgba(255,255,200,.07)':'rgba(0,30,0,.12)';x.fillRect(rnd(0,w),rnd(0,h),rnd(1,3),rnd(1,3))}
  for(let i=0;i<30;i++){x.fillStyle='rgba(70,60,20,.1)';x.beginPath();x.arc(rnd(0,w),rnd(0,h),rnd(4,14),0,7);x.fill()}
});
const pMat=new THREE.MeshStandardMaterial({map:pTex,bumpMap:pTex,bumpScale:1.5,roughness:.42,metalness:.15});
const cMat2=pMat.clone();cMat2.color.set(0xd6e8c8);
const bodyG=new THREE.CylinderGeometry(1,1,1,32),capG=new THREE.CylinderGeometry(1.3,1.3,.8,32);
let GAP=4.4;const CAPH=.8,pipes=[];
function mk(){
  const g=new THREE.Group();
  const parts=['bb','bc','tb','tc'].map((k,i)=>{const m=new THREE.Mesh(i%2?capG:bodyG,i%2?cMat2:pMat);m.castShadow=m.receiveShadow=true;g.add(m);return m});
  scene.add(g);return {g,bb:parts[0],bc:parts[1],tb:parts[2],tc:parts[3],x:0,gy:8,done:false};
}
function setGap(p,gy){
  p.gy=gy;p.done=false;setPerk(p);
  const bt=gy-GAP/2-CAPH,tt=gy+GAP/2+CAPH,th=26-tt;
  p.bb.scale.set(1,bt,1);p.bb.position.y=bt/2;
  p.bc.position.y=gy-GAP/2-CAPH/2;
  p.tc.position.y=gy+GAP/2+CAPH/2;
  p.tb.scale.set(1,th,1);p.tb.position.y=tt+th/2;
}
for(let i=0;i<6;i++)pipes.push(mk());

// Bird
const bird=new THREE.Group();
const mat=(c,r=.6)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function part(geo,m,pos,sc){const o=new THREE.Mesh(geo,m);o.position.set(...pos);if(sc)o.scale.set(...sc);o.castShadow=true;return o}
const S=new THREE.SphereGeometry(1,28,20);
bird.add(part(S,mat(0xf2c230,.7),[0,0,0],[.62,.52,.5]));
bird.add(part(S,mat(0xfbe7a0,.8),[.08,-.18,0],[.5,.3,.42]));
bird.add(part(S,mat(0xd9a21c,.7),[-.62,.08,0],[.28,.12,.28]));
const beak=part(new THREE.ConeGeometry(.2,.46,18).rotateZ(-Math.PI/2),mat(0xe8641b,.5),[.82,-.04,0]);bird.add(beak);
const wings=[];
[1,-1].forEach(s=>{
  bird.add(part(S,mat(0xffffff,.25),[.4,.2,s*.38],[.17,.17,.17]));
  bird.add(part(S,mat(0x050505,.2),[.51,.2,s*.46],[.09,.09,.09]));
  const p=new THREE.Group();p.position.set(-.1,.05,s*.4);
  p.add(part(S,mat(0xe0a820,.65),[0,0,s*.35],[.4,.08,.5]));bird.add(p);wings.push([p,s]);
});
scene.add(bird);

// State
let state='ready',score=0,best=0,vy=0,t=0,speed=5.2,shake=0,deadT=0,wing=0,camY=8,by=8;
try{best=+localStorage.getItem('fb3d')||0}catch(e){}
function reset(){
  state='ready';score=0;vy=0;by=8;bird.rotation.z=0;speed=5.2;

const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05)*(slow>0?.6:1)*(hs>0?.25:1);t+=dt;
  if(state==='ready'||state==='clear'||state==='menu')by+=(8+Math.sin(t*3)*.35-by)*Math.min(1,dt*5);
  if(state!=='dead'&&state!=='eat'){world.position.x-=(state==='play'?speed:2)*dt;if(world.position.x<-PER)world.position.x+=PER}
  if(state==='play'){
    vy-=D.g*(rule==='moon'?.55:1)*dt;by+=vy*dt;speed=(D.sp+Math.min((wi*GOAL+score)*D.inc,2.5))*(rule==='wind'?1.35:1);
    if(by>16.5){by=16.5;vy=0}

  wings.forEach(([p,s])=>p.rotation.x=-s*(f+.2));
  updP(dt);updG(dt);updQ(dt);updM(dt);updX(dt);updFx(dt);clouds.forEach(c=>{c.position.x-=dt*.6;if(c.position.x<-70)c.position.x=70});
  camY+=(8+(by-8)*.25-camY)*Math.min(1,dt*3);

  cam.position.set(3.5+rnd(-1,1)*shake,camY+rnd(-1,1)*shake,cam.userData.d);
  cam.lookAt(3.5,camY-.6,0);
