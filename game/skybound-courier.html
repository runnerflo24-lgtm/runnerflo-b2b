<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../security-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Skybound Courier</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.38) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#f00}
  #speed{display:none;position:fixed;inset:0;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0deg 2deg,rgba(255,255,255,.3) 2.4deg,rgba(255,255,255,0) 3deg 5.5deg);-webkit-mask-image:radial-gradient(circle,transparent 40%,#000 88%);mask-image:radial-gradient(circle,transparent 40%,#000 88%)}
  #hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;max-width:44vw;z-index:5}
  .pill{background:rgba(10,25,45,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);padding:7px 13px;border-radius:999px;font-weight:600;font-size:14px;letter-spacing:.3px}
  #top{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;min-width:260px;z-index:5}
  #tmain{font-size:32px;font-weight:800;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  #tmain.low{color:#ff5a4a;animation:pulse .5s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.18)}}
  #tsub{font-size:13px;opacity:.85;margin-top:-4px;min-height:16px}
  #bar{position:relative;height:8px;margin:8px 10px 0;border-radius:6px;background:rgba(255,255,255,.22)}
  #barfill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#7ff3ff,#ffb25c);width:0}
  #barflag{position:absolute;right:-8px;top:-15px;font-size:16px}
  #barme{position:absolute;top:-4px;left:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:2px solid #17b0a4}
  #combo{position:fixed;top:max(14px,env(safe-area-inset-top));right:calc(max(16px,env(safe-area-inset-right)) + 48px);text-align:right;pointer-events:none;font-weight:800;font-size:30px;color:#ffb25c;text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:5}
  #combo small{display:block;font-size:12px;color:#fff;opacity:.8;font-weight:600}
  #combo i{display:block;height:5px;border-radius:4px;background:#ffb25c;margin-top:4px}
  #pauseBtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:8;width:44px;height:44px;min-width:44px;min-height:44px;border-radius:50%;background:rgba(10,25,45,.75);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:16px;cursor:pointer;display:none;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:manipulation;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  #toasts{position:fixed;top:112px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90vw;z-index:6}
  .toast{background:rgba(10,25,45,.78);border:1px solid rgba(255,255,255,.25);padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;animation:tin .25s ease-out,tout .4s 2.6s forwards}
  .toast.combo{background:rgba(255,138,42,.9);color:#1b1206}
  .toast.good{background:rgba(40,200,140,.9);color:#06210f}
  .toast.warn{background:rgba(220,50,40,.9)}
  @keyframes tin{from{transform:translateY(-12px) scale(.9);opacity:0}to{transform:none;opacity:1}}
  @keyframes tout{to{opacity:0;transform:translateY(-8px)}}
  .pop{position:fixed;pointer-events:none;font-weight:900;font-size:22px;text-shadow:0 2px 6px rgba(0,0,0,.8);animation:rise .9s ease-out forwards;transform:translate(-50%,-50%);z-index:6}
  @keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-70px}}
  #banner{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);font-size:26px;font-weight:900;letter-spacing:3px;text-shadow:0 0 14px #ff3b2a;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;z-index:6}
  #banner.on{opacity:1;animation:pulse .35s infinite alternate}
  #count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;font-weight:900;pointer-events:none;text-shadow:0 0 30px rgba(255,160,60,.9);opacity:0;z-index:6}
  #count.on{animation:cnt .9s ease-out}
  @keyframes cnt{from{opacity:1;transform:scale(2.2)}to{opacity:0;transform:scale(.8)}}
  #help{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:max(14px,env(safe-area-inset-left));font-size:12.5px;opacity:.85;background:rgba(10,25,45,.45);padding:8px 12px;border-radius:10px;pointer-events:none;line-height:1.5;z-index:5}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(8,20,40,.35),rgba(8,20,40,.82));text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:9}
  #overlay .card{max-width:880px;padding:22px 30px;max-height:calc(100vh - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  #overlay h1{margin:0 0 6px;font-size:42px;letter-spacing:2px;background:linear-gradient(90deg,#7ff3ff,#ffb25c);-webkit-background-clip:text;background-clip:text;color:transparent}
  #overlay p{margin:8px 0;opacity:.92;line-height:1.55}
  .btn{display:inline-flex;align-items:center;justify-content:center;margin:14px 6px 0;padding:12px 26px;min-height:44px;border-radius:12px;background:#ff8a2a;color:#1b1206;font-weight:800;letter-spacing:1px;cursor:pointer;touch-action:manipulation}
  .btn:active{transform:scale(0.97)}
  .btn.alt{background:rgba(255,255,255,.18);color:#fff}
  .row{display:flex;gap:10px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
  .opt{flex:1 1 170px;max-width:250px;min-height:48px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:.15s;touch-action:manipulation}
  .opt b{letter-spacing:2px}
  .opt small{opacity:.78;font-size:11.5px;line-height:1.35}
  .opt:hover,.opt:active{background:rgba(255,255,255,.2)}
  .opt.on{border-color:#ffb25c;background:rgba(255,138,42,.28)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
  .ep{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:4px;touch-action:manipulation;min-height:44px}
  .ep:hover,.ep:active{background:rgba(255,255,255,.22);transform:translateY(-3px)}
  .ep b{color:#ffb25c;letter-spacing:1.5px;font-size:12px}
  .ep span{font-weight:700;font-size:17px}
  .ep small{opacity:.75;font-size:12px}
  .ep em{font-style:normal;color:#7ff3ff;font-size:12px;margin-top:2px}
  .rules{text-align:left;display:grid;gap:7px;margin:12px 0;font-size:14px}
  .rules div{background:rgba(255,255,255,.09);border-radius:10px;padding:7px 12px;line-height:1.4}
  .rules b{color:#ffb25c;margin-right:6px}
  .stars{font-size:44px;letter-spacing:6px;color:#ffd23a;text-shadow:0 0 14px rgba(255,200,60,.7)}
  kbd{background:rgba(255,255,255,.18);border-radius:5px;padding:1px 7px;font-family:inherit;font-weight:600}
  @media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}#overlay h1{font-size:30px}#tmain{font-size:26px}}
  #overlay.side{justify-content:flex-start;padding-left:3vw}
  #overlay.side .card{max-width:440px;background:rgba(8,20,40,.72);border-radius:16px;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #overlay.side h1{font-size:30px}
  .fmt{font-size:12.5px;opacity:.75;text-align:left}.cmsg{font-weight:700}.cinfo{font-size:14px}
  .drop{display:block;border:2px dashed rgba(255,255,255,.45);border-radius:12px;padding:16px;cursor:pointer;margin:10px 0;font-weight:700;min-height:44px;touch-action:manipulation}.drop:hover{background:rgba(255,255,255,.1)}
  .crow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .chip{padding:6px 14px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.14);cursor:pointer;font-size:13px;touch-action:manipulation}.chip.on{background:#ff8a2a;color:#1b1206;font-weight:700}
  .btn.sm{margin:0;padding:6px 12px;font-size:13px;min-height:36px}
  .cmap{display:grid;gap:5px;text-align:left;font-size:13px;margin:8px 0}.cmap label{display:flex;justify-content:space-between;gap:8px;align-items:center}.cmap select{max-width:210px;background:#12243a;color:#fff;border:1px solid #456;border-radius:6px;padding:4px}
  #overlay.pm{align-items:stretch;justify-content:flex-start;text-align:left;overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(90deg,rgba(2,8,20,.9) 0%,rgba(2,8,20,.55) 36%,rgba(2,8,20,0) 68%),linear-gradient(0deg,rgba(2,8,20,.88) 0%,rgba(2,8,20,0) 36%)}
  #overlay.pm .card{max-width:none;width:100%;padding:0}
  .pmenu{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:max(7vh,env(safe-area-inset-top)) max(6vw,env(safe-area-inset-right)) max(4vh,env(safe-area-inset-bottom)) max(6vw,env(safe-area-inset-left));box-sizing:border-box}.pmenu.c{justify-content:center}
  .pm-logo{font-weight:200;font-size:clamp(32px,6vw,76px);letter-spacing:.28em;line-height:1.08;color:#fff;text-shadow:0 0 36px rgba(120,200,255,.4)}.pm-logo.sm{font-size:clamp(26px,4.4vw,54px);margin:8px 0 22px}
  .pm-tag{margin-top:14px;letter-spacing:.32em;font-size:12px;opacity:.65;text-transform:uppercase}.pm-logo+.pm-tag::before{content:'';display:block;width:56px;height:2px;background:#ff8a2a;margin-bottom:14px}
  .pm-list{margin-top:5vh;display:flex;flex-direction:column;max-width:480px}.pb-list+.pm-list,.pb-haz+.pm-list{margin-top:4vh}
  .pm-item{display:flex;justify-content:space-between;align-items:baseline;gap:30px;padding:13px 0 13px 18px;border-left:2px solid transparent;cursor:pointer;letter-spacing:.2em;font-size:15px;color:rgba(255,255,255,.72);transition:all .2s;touch-action:manipulation;min-height:44px}
  .pm-item:hover,.pm-item:active{border-left-color:#ff8a2a;color:#fff;background:linear-gradient(90deg,rgba(255,255,255,.14),transparent);padding-left:26px}
  .pm-item.main{font-size:22px;color:#fff;font-weight:600;margin-bottom:6px}.pm-item em{font-style:normal;font-size:12px;letter-spacing:.14em;opacity:.7}
  .pm-sub{margin:22px 0 0 20px;font-size:13px;letter-spacing:.1em;opacity:.6}
  .pm-strip{display:flex;gap:14px;align-items:flex-end;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:14px 4px 10px}
  .pm-ep{flex:0 0 156px;height:98px;padding:12px 14px;box-sizing:border-box;border-radius:6px;cursor:pointer;position:relative;background:linear-gradient(160deg,var(--c1),var(--c2));opacity:.5;filter:saturate(.75);transition:all .25s;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;touch-action:manipulation}
  .pm-ep:hover,.pm-ep:active{opacity:.85}.pm-ep.sel{opacity:1;filter:none;transform:translateY(-8px) scale(1.06);box-shadow:0 14px 36px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.9)}
  .pm-ep b{position:absolute;top:0;right:12px;font-size:46px;font-weight:200;opacity:.85}.pm-ep span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;text-shadow:0 1px 5px rgba(0,0,0,.7)}.pm-ep small{font-size:11px;color:#ffd23a;min-height:14px}
  .pm-foot{font-size:11px;letter-spacing:.2em;opacity:.55;text-transform:uppercase;margin-top:12px}
  .pb-list{display:grid;gap:14px;max-width:560px}.pb-list div{display:flex;gap:16px;align-items:center;font-size:16px;line-height:1.4;opacity:.92}.pb-list i{font-style:normal;font-size:22px;width:30px;text-align:center}.pb-list b{color:#ffb25c;font-weight:600}
  .pb-haz{margin-top:22px;display:flex;gap:10px 22px;flex-wrap:wrap;max-width:600px;font-size:13px;letter-spacing:.08em;opacity:.8}

  /* Touch Controls */
  #touchCtrl{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:7}
  .t-dpad{display:flex;flex-direction:column;align-items:center;pointer-events:auto;gap:4px}
  .t-mid{display:flex;align-items:center;gap:4px}
  .t-center{width:46px;height:46px}
  .t-key{width:52px;height:52px;min-width:46px;min-height:46px;border-radius:14px;background:rgba(10,25,45,.72);border:1.5px solid rgba(255,255,255,.25);color:#fff;font-size:22px;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .06s,background .06s}
  .t-key:active{transform:scale(.92);background:rgba(255,138,42,.45);border-color:#ffb25c}
  .t-actions{display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
  .t-act{min-width:76px;height:52px;padding:0 16px;border-radius:26px;background:rgba(10,25,45,.75);border:2px solid rgba(255,255,255,.3);color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 6px 16px rgba(0,0,0,.45);transition:transform .06s,background .06s}
  .t-act:active{transform:scale(.93)}
  .t-jump{background:linear-gradient(135deg,rgba(255,138,42,.85),rgba(230,90,20,.85));border-color:#ffd23a;color:#1b1206;height:62px;min-width:86px;font-size:15px}
  .t-sprint.on{background:rgba(40,200,140,.85);border-color:#7ff3ff;color:#06210f}

  @media(max-width:600px){
    #hud{max-width:calc(100vw - 32px);gap:4px}
    .pill{padding:4px 8px;font-size:12px}
    #top{min-width:200px}
    #tmain{font-size:24px}
    #combo{font-size:22px;right:calc(max(10px,env(safe-area-inset-right)) + 46px)}
    #help{display:none}
    .t-key{width:46px;height:46px;font-size:19px}
    .t-center{width:40px;height:40px}
    .t-jump{height:56px;min-width:76px;font-size:14px}
  }
  @media(max-height:520px){
    .pmenu{min-height:100vh;padding:12px 16px;overflow-y:auto}
    .pm-logo{font-size:26px}
    .pm-tag{margin-top:4px;font-size:11px}
    .pm-list{margin-top:8px}
    .pm-item{padding:6px 0 6px 10px;font-size:13px;min-height:38px}
    .pm-item.main{font-size:16px}
    .t-key{width:42px;height:42px;font-size:17px}
    .t-center{width:34px;height:34px}
    .t-jump{height:48px;min-width:68px;font-size:13px}
    .t-act{height:42px;min-width:64px;font-size:12px}
    #touchCtrl{bottom:max(6px,env(safe-area-inset-bottom))}
    #overlay .card{padding:14px 18px}
  }
</style>
</head>
<body>
<div id="vig"></div><div id="speed"></div><div id="flash"></div>
<div id="hud">
  <div class="pill" id="hEp">EP 1</div>
  <div class="pill" id="hMode"></div>
  <div class="pill" id="hGems">💎 0/0</div>
  <div class="pill" id="hLives">❤❤❤</div>
  <div class="pill" id="hScore">⭐ 0</div>
</div>
<div id="top"><div id="tmain"></div><div id="tsub"></div><div id="bar"><i id="barfill"></i><b id="barflag">🏁</b><u id="barme"></u></div></div>
<div id="combo"></div>
<div id="toasts"></div>
<div id="banner"></div>
<div id="count"></div>
<div id="help"><kbd>WASD</kbd>/<kbd>↑↓←→</kbd> move · <kbd>Space</kbd> jump (in air = double jump) · <kbd>Shift</kbd> run<br>Drag mouse / <kbd>Q</kbd><kbd>E</kbd> camera · <kbd>P</kbd> pause · <kbd>R</kbd> restart · <kbd>M</kbd> menu · <kbd>N</kbd> music</div>
<button id="pauseBtn" aria-label="Pause">❚❚</button>
<div id="touchCtrl">
  <div class="t-dpad">
    <button type="button" id="tUp" class="t-key t-up" aria-label="Forward">▲</button>
    <div class="t-mid">
      <button type="button" id="tLeft" class="t-key t-left" aria-label="Left">◀</button>
      <div class="t-center"></div>
      <button type="button" id="tRight" class="t-key t-right" aria-label="Right">▶</button>
    </div>
    <button type="button" id="tDown" class="t-key t-down" aria-label="Back">▼</button>
  </div>
  <div class="t-actions">
    <button type="button" id="tSprint" class="t-act t-sprint" aria-label="Sprint">⚡ SPRINT</button>
    <button type="button" id="tJump" class="t-act t-jump" aria-label="Jump">▲ JUMP</button>
  </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cache={};
function setT(id,t){ if(cache[id]!==t){ cache[id]=t; $(id).textContent=t; } }
function setH(id,h){ if(cache[id]!==h){ cache[id]=h; $(id).innerHTML=h; } }
function fmt(t){ const m=Math.floor(t/60),s=Math.floor(t%60); return m+':'+(s<10?'0':'')+s; }

/* ================= Renderer ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xa9cbe8,45,200);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,700);
const BASE_FOV=60;

/* ================= Sky ================= */
const skyU={top:{value:new THREE.Vector3()},hor:{value:new THREE.Vector3()},sunDir:{value:new THREE.Vector3(.5,.75,.35)},sunCol:{value:new THREE.Vector3(1,.85,.6)},stars:{value:0}};
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyU,
  vertexShader:"varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
  fragmentShader:"uniform vec3 top;uniform vec3 hor;uniform vec3 sunDir;uniform vec3 sunCol;uniform float stars;varying vec3 vD;"+
  "float hash(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}"+
  "void main(){vec3 d=normalize(vD);float h=max(d.y,0.0);vec3 col=mix(hor,top,pow(h,0.5));float s=max(dot(d,normalize(sunDir)),0.0);"+
  "col+=sunCol*(pow(s,700.0)*4.0+pow(s,10.0)*0.28);"+
  "if(stars>0.0){float st=step(0.9972,hash(floor(d*220.0)));col+=vec3(st)*stars*smoothstep(0.02,0.35,d.y);}"+
  "if(d.y<0.0)col=mix(hor,mix(hor,top,0.4)*0.8,min(-d.y*3.0,1.0));gl_FragColor=vec4(col,1.0);}"
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(500,32,16),skyMat); scene.add(sky);
const envScene=new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),skyMat));
const pmrem=new THREE.PMREMGenerator(renderer); let envRT=null;

/* ================= Lights ================= */
const hemi=new THREE.HemisphereLight(0xbfd9ff,0x56633f,.45); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d4,1.5);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera; sc.left=-34; sc.right=34; sc.top=34; sc.bottom=-34; sc.near=1; sc.far=160;

  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);

  if(s%4===0){ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+.12); g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.0001,t+.14); o.connect(g); g.connect(master); o.start(t); o.stop(t+.16); }
  if(s%2===0){ const bi=[0,0,3,2][Math.floor(s/4)%4]; mnote(f(sc[bi%sc.length]-12),t,.22,'triangle',.12); }

/* ================= Level generation ================= */
function generate(T,D,md){
  const R=rng(T.seed+(md==='run'?500:0)), specs=[], hovers=[];
  const N=md==='run'?T.n*3:T.n;
  let c={x:0,y:0,z:0,w:12,d:12,h:2,type:'static',rest:true,start:true}; specs.push(c);
  for(let i=1;i<N;i++){
    const last=i===N-1, rest=last||i%5===0;
    const gm=D.gap*(md==='run'?(.8+.4*i/(N-1)):1);
    const nw=last?10+D.size:rest?8+D.size:3.3+R()*2.0+D.size, nd=last?10+D.size:rest?8+D.size:3.3+R()*2.0+D.size;
    const dy=(T.rise[0]+R()*(T.rise[1]-T.rise[0]))*D.rise;
    let ny=Math.max(-1,Math.min(24,c.y+dy));
    const lat=(c.w+nw)/2+2.0*gm;
    const nx=c.x+(R()-.5)*2*lat*.8-c.x*.12;
    const prev=c;
    if(!rest && R()<T.moveP*D.move){
      const md4=4+D.size, far=Math.max(.6,3.25*gm-1.5), amp=Math.min(1.5,far-.25), G=md4+2*far, nz=c.z-c.d/2-G-nd/2; ny=c.y+dy*.4;
      specs.push({x:(c.x+nx)/2,y:(c.y+ny)/2,z:c.z-c.d/2-G/2,w:md4,d:md4,h:1.2,type:'move',axis:'z',amp:amp,speed:.8,ph:R()*6});
      c={x:nx,y:ny,z:nz,w:nw,d:nd,h:2,type:'static',rest,goal:last}; specs.push(c);
    } else {
      const gap=(T.gap[0]+R()*(T.gap[1]-T.gap[0]))*gm;
      const nz=c.z-c.d/2-gap-nd/2;
      const crumble=!rest&&R()<T.crumbleP*D.crumble;
      c={x:nx,y:ny,z:nz,w:nw,d:nd,h:2,type:crumble?'crumble':'static',rest,goal:last}; specs.push(c);
      if(!rest && gap>2.9 && R()<T.hoverP*D.hover) hovers.push({x:(prev.x+c.x)/2,y:Math.max(prev.y,c.y)+1.7,z:(prev.z-prev.d/2+c.z+c.d/2)/2});
    }
  }
  return {specs,hovers,R,N};
}

function setBounds(b){ b.minX=b.x-b.w/2; b.maxX=b.x+b.w/2; b.minY=b.y-b.h; b.maxY=b.y; b.minZ=b.z-b.d/2; b.maxZ=b.z+b.d/2; b.mesh.position.set(b.x,b.y-b.h/2,b.z); }
function addPlat(s,T){
  const w=s.w,h=s.h,d=s.d,tk=T.surf.top[0],to=T.surf.top[1],sk=T.surf.side[0],so=T.surf.side[1],r=T.surf.r,m=T.surf.m;
  let mats;
  if(s.type==='move'){ const mm=()=>tmat('metalMove',METAL,w/3,h/1.5,.35,.75); mats=[mm(),mm(),tmat('metalMove',METAL,w/3,d/3,.35,.75),mm(),mm(),mm()]; }
  else { const tint=s.type==='crumble'?0xc09a80:null;
    mats=[tmat(sk,so,d/3,h/3,r,m,tint),tmat(sk,so,d/3,h/3,r,m,tint),tmat(tk,to,w/3,d/3,r,m,tint),tmat(sk,so,w/3,d/3,r,m,tint),tmat(sk,so,w/3,h/3,r,m,tint),tmat(sk,so,w/3,h/3,r,m,tint)]; }
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats); mesh.castShadow=mesh.receiveShadow=true; LG.add(mesh);
  const b={mesh,x:s.x,y:s.y,z:s.z,w,h,d,type:s.type,active:true,dx:0,dy:0,dz:0,by:s.y,base:s.z,amp:s.amp||0,speed:s.speed||0,ph:s.ph||0,st:0,t:0,vy:0,rest:s.rest,goal:s.goal,start:!!s.start,cp:!!s.start};
  setBounds(b);
  if(T.trim){ const tm=new THREE.MeshBasicMaterial({color:T.trim}), t=.1, y=h/2+.02; [[w+t,t,t,0,y,d/2],[w+t,t,t,0,y,-d/2],[t,t,d+t,w/2,y,0],[t,t,d+t,-w/2,y,0]].forEach(q=>{ const e=new THREE.Mesh(new THREE.BoxGeometry(q[0],q[1],q[2]),tm); e.position.set(q[3],q[4],q[5]); mesh.add(e); }); }
  if(s.type==='static'){ const sz=Math.min(w,d), cone=new THREE.Mesh(new THREE.ConeGeometry(sz*.45,sz*.9,8),tmat(sk,so,2,2,r,m)); cone.rotation.x=Math.PI; cone.position.y=-h/2-sz*.45; cone.castShadow=true; mesh.add(cone); }
  plats.push(b); return b;
}

function decor(kind,x,y,z,s,R){
  const g=new THREE.Group(), std=(c,r,m,e)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m||0,emissive:e||0});
  if(kind==='tree'){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.28*s,1.6*s,8),std(0x5a3d24,1)); t.position.y=.8*s; g.add(t);
    const lm=std(0x2f7a3a,.85); for(let i=0;i<3;i++){ const c=new THREE.Mesh(new THREE.ConeGeometry((1.3-i*.3)*s,(1.6-i*.2)*s,10),lm); c.position.y=(1.7+i*.95)*s; g.add(c); }
  } else if(kind==='cactus'){
    const gm=std(0x3f7a3a,.8); const b=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.26*s,2*s,10),gm); b.position.y=s; g.add(b);
    const top=new THREE.Mesh(new THREE.SphereGeometry(.22*s,10,8),gm); top.position.y=2*s; g.add(top);
    for(const sd of [-1,1]){ const a=new THREE.Mesh(new THREE.CylinderGeometry(.13*s,.13*s,.8*s,8),gm); a.position.set(sd*.42*s,1.2*s+(sd>0?.2*s:0),0); g.add(a); }
  } else if(kind==='pine'){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.24*s,1.3*s,8),std(0x4a3626,1)); t.position.y=.65*s; g.add(t);
    for(let i=0;i<4;i++){ const c=new THREE.Mesh(new THREE.ConeGeometry((1.2-i*.25)*s,1.3*s,10),std(i%2?0xe9f2f8:0x2a5a46,.8)); c.position.y=(1.5+i*.8)*s; g.add(c); }
  } else if(kind==='crystal'){
    const cols=[0x40e0ff,0xb070ff,0x50ffb0]; const col=cols[Math.floor(R()*3)];
    for(let i=0;i<5;i++){ const h=(.8+R()*1.8)*s; const c=new THREE.Mesh(new THREE.ConeGeometry(.22*s,h,6),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:1.4,roughness:.15,metalness:.2,transparent:true,opacity:.92})); c.position.set((R()-.5)*.8*s,h/2,(R()-.5)*.8*s); c.rotation.z=(R()-.5)*.5; g.add(c); }
  } else if(kind==='rock'){
    for(let i=0;i<3;i++){ const r=new THREE.Mesh(new THREE.DodecahedronGeometry((.4+R()*.5)*s,0),std(0x2a2523,.9,.05)); r.position.set((R()-.5)*1.2*s,.3*s,(R()-.5)*1.2*s); r.rotation.set(R()*3,R()*3,R()*3); g.add(r); }
    const em=new THREE.Mesh(new THREE.SphereGeometry(.12*s,8,6),std(0xff6a1a,.5,0,0xff5a10)); em.position.y=.9*s; g.add(em);
  } else if(kind==='pylon'){
    const c=new THREE.Mesh(new THREE.BoxGeometry(.5*s,2.6*s,.5*s),std(0x6a7488,.35,.8)); c.position.y=1.3*s; g.add(c);
    const l=new THREE.Mesh(new THREE.SphereGeometry(.2*s,12,10),std(0x7ff3ff,.2,0,0x35e0ff)); l.material.emissiveIntensity=2; l.position.y=2.8*s; g.add(l);
  }
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  g.position.set(x,y,z); g.rotation.y=R()*6; LG.add(g);
}

/* ---------- Enemies ---------- */
let EA=null; const SPN=16, SPD=[];
for(let i=0;i<SPN;i++){ const yy=1-2*(i+.5)/SPN, r=Math.sqrt(1-yy*yy), th=i*2.399963; SPD.push(new THREE.Vector3(Math.cos(th)*r,yy,Math.sin(th)*r)); }
function makeEA(T){
  EA={bm:new THREE.MeshStandardMaterial({color:T.en.body,roughness:.35,metalness:.5}),sm:new THREE.MeshStandardMaterial({color:T.en.spike,roughness:.3,metalness:.8}),
      em:new THREE.MeshStandardMaterial({color:T.en.eye,emissive:T.en.eye,emissiveIntensity:1.6}),
      gB:new THREE.SphereGeometry(.5,20,14),gS:new THREE.ConeGeometry(.1,.34,6),gE:new THREE.SphereGeometry(.09,10,8)};
}
function buildEnemy(x,y,z,axis,amp,speed,hover,kind,plat){
  const g=new THREE.Group(), spin=new THREE.Group();
  spin.add(new THREE.Mesh(EA.gB,EA.bm));
  const up=new THREE.Vector3(0,1,0);
  SPD.forEach(dir=>{ const s=new THREE.Mesh(EA.gS,EA.sm); s.position.copy(dir).multiplyScalar(.58); s.quaternion.setFromUnitVectors(up,dir); spin.add(s); });
  g.add(spin);
  const em=kind==='chaser'?EA.em.clone():EA.em;
  const e1=new THREE.Mesh(EA.gE,em), e2=new THREE.Mesh(EA.gE,em); e1.position.set(-.17,.12,.46); e2.position.set(.17,.12,.46); g.add(e1,e2);
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;}); LG.add(g);
  if(kind==='chaser') present.chaser++;
  enemies.push({g,spin,kind:kind||'patrol',plat:plat||null,em,x0:x,y0:y,z0:z,axis,amp,speed:speed*DF().espd,hover,t:Math.random()*6,alive:true,x:x,y:y,z:z,sq:0,charge:false});
}

function buildSweeper(b,D,R2){
  const L=Math.min(b.w,b.d)/2-.4, g=new THREE.Group(), arm=new THREE.Group();
  const bm=new THREE.MeshStandardMaterial({color:0xd8dde6,metalness:.8,roughness:.3});
  const bar=new THREE.Mesh(new THREE.BoxGeometry(L*2,.28,.3),bm); bar.position.y=.42; arm.add(bar);
  const tm=new THREE.MeshStandardMaterial({color:0xff4020,emissive:0xff2000,emissiveIntensity:1.2});
  for(const sd of [-1,1]){ const tip=new THREE.Mesh(new THREE.BoxGeometry(.4,.4,.42),tm); tip.position.set(sd*(L-.2),.42,0); arm.add(tip); }
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.3,.38,.7,16),bm); hub.position.y=.35;
  g.add(hub,arm); g.position.set(b.x,b.maxY,b.z); g.traverse(o=>{if(o.isMesh)o.castShadow=true;}); LG.add(g);
  sweepers.push({g,arm,L,x:b.x,z:b.z,top:b.maxY,ang:R2()*6.28,w:(1.3+R2()*.6)*D.sw*(R2()<.5?-1:1)}); present.sweeper++;

function starMesh(){

}
function clockMesh(){

function buildLevel(i){
  clearLevel(); const T=THEMES[i], D=DF(); setTheme(T);
  LG=new THREE.Group(); scene.add(LG);
  plats=[];gems=[];enemies=[];flags=[];clouds=[];sweepers=[];jets=[];springs=[];pickups=[];meteors=[];
  present={sweeper:0,jet:0,spring:0,crumble:0,chaser:0,hover:0,mover:0,meteor:0,wind:0};
  const G=generate(T,D,mode), specs=G.specs, hovers=G.hovers;
  const R2=rng(T.seed+999+(mode==='run'?7:0));
  makeEA(T);
  const P=specs.map(s=>addPlat(s,T));
  buildLiquid(T);
  P.forEach(b=>{ if(b.type==='crumble') present.crumble++; if(b.type==='move') present.mover++; });
  present.hover=hovers.length; present.meteor=(T.meteor&&D.meteor>0)?1:0; present.wind=(T.wind&&D.wind>0)?1:0;

  const gemGeo=new THREE.OctahedronGeometry(.32,0);
  const gemMat=new THREE.MeshStandardMaterial({color:0x58e8ff,emissive:0x0b6f8e,emissiveIntensity:T.glow>0?1.8:.9,roughness:.12,metalness:.2});
  const addGem=(x,y,z)=>{ const m=new THREE.Mesh(gemGeo,gemMat); m.scale.y=1.45; m.position.set(x,y,z); m.castShadow=true; LG.add(m); gems.push({m,x,y,z,got:false,ph:Math.random()*6}); };
  const restIdx=[];
  P.forEach((b,k)=>{
    addGem(b.x,b.maxY+1.1,b.z);
    if(b.w>=7){ addGem(b.x-b.w/4,b.maxY+1.1,b.z); addGem(b.x+b.w/4,b.maxY+1.1,b.z); }
    if(k<P.length-1){ const q=P[k+1]; addGem((b.x+q.x)/2,Math.max(b.maxY,q.maxY)+2.3,(b.z+q.z)/2); }
    const hz=D.haz*T.haz*(mode==='run'?(.4+.6*k/P.length):1);
    if(k>0 && b.type!=='move'){
      if(b.rest && !b.goal){
        restIdx.push(k);
        const amp=Math.max(.6,b.w/2-1.4);
        buildEnemy(b.x,b.maxY+.55,b.z-1.5,'x',amp,1+R2()*.4,false,'patrol',b);
        if(D.chase) buildEnemy(b.x+1.5,b.maxY+.55,b.z+1.5,'x',0,1,false,'chaser',b);
        else if(D.enemy>=.5) buildEnemy(b.x-1.5,b.maxY+.55,b.z,'z',amp,.8+R2()*.4,false,'patrol',b);
        if(b.w>=6.5 && R2()<Math.min(.9,hz*.8)) buildSweeper(b,D,R2);
        else if(R2()<hz*.6){ buildJet(b,T,-(b.w/2-1.5),(R2()-.5)*(b.d-3),R2); if(hz>.8) buildJet(b,T,-(b.w/2-1.5),(R2()<.5?-1:1)*(b.d/2-1.2),R2); }
      } else if(b.goal){
        if(D.enemy>=.5) buildEnemy(b.x,b.maxY+.55,b.z+2,'x',3,1,false,'patrol',b);
      } else if(b.type==='static'){
        if(b.w>=4.4 && R2()<T.enemyP*D.enemy) buildEnemy(b.x,b.maxY+.55,b.z,'x',Math.max(.5,(b.w-1.6)/2-.2),1+R2()*.4,false,'patrol',b);
        if(b.w>=4.6 && b.d>=4.6 && R2()<hz*.35) buildJet(b,T,(R2()<.5?-1:1)*(b.w/2-1.2),(R2()<.5?-1:1)*(b.d/2-1.2),R2);
        if(b.w>=3.6 && R2()<(D.haz<.5?.3:.18)) buildSpring(b,0,0);
      }
    }
    if(b.rest){
      const pole=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,2.2,8),new THREE.MeshStandardMaterial({color:0xcfd6df,metalness:.8,roughness:.3}));
      const cloth=new THREE.Mesh(new THREE.PlaneGeometry(.9,.55),new THREE.MeshStandardMaterial({color:0xff8a2a,side:THREE.DoubleSide,roughness:.7,emissive:0x331000}));
      const fg=new THREE.Group(); pole.position.y=1.1; cloth.position.set(.45,1.9,0); fg.add(pole,cloth); fg.position.set(b.x+b.w/2-1,b.maxY,b.z-b.d/2+1); pole.castShadow=true;
      LG.add(fg); flags.push({fg,cloth,plat:b});

      for(const e of enemies){ if(!e.alive||state!=='play') continue;
        if(Math.hypot(p.x-e.x,p.z-e.z)<.95&&p.y<e.y+.55&&p.y+HGT>e.y-.5){
          if(starT>0) killEnemy(e,true); else if(p.vy<0&&p.y>e.y+.1) killEnemy(e,false); else hurt(e.x,e.z,'Touched an enemy');
        } }
      if(state==='play'&&p.y<-12) loseLife(D.fall,'Fell into the abyss');
      if(state==='play'&&Math.hypot(p.x-goalGroup.position.x,p.z-goalGroup.position.z)<1.6&&Math.abs(p.y-goalGroup.position.y)<2){ win(); }
    }
  }

  /* player visuals */
  player.position.set(p.x,p.y,p.z);
  const sp=Math.hypot(p.vx,p.vz);
  if(sp>.6){ const tg=Math.atan2(p.vx,p.vz); let d=tg-face; d=Math.atan2(Math.sin(d),Math.cos(d)); face+=d*Math.min(1,dt*14); }
  model.rotation.y=face; walkT+=dt*sp*1.6;
  const sw=onGround?Math.sin(walkT)*Math.min(sp/6,1):0;
  footL.position.z=.04+sw*.2; footR.position.z=.04-sw*.2;
  footL.position.y=.08+(onGround?Math.max(0,-sw)*.1:.12); footR.position.y=.08+(onGround?Math.max(0,sw)*.1:.12);
  armL.position.z=-sw*.15; armR.position.z=sw*.15; armL.position.y=armR.position.y=onGround?.66:.9;
  landSq=Math.max(0,landSq-dt*.6);
  const st=clamp(p.vy*.012,-.12,.18)-landSq; model.scale.set(1-st*.5,1+st,1-st*.5);
  model.position.y=onGround?Math.abs(Math.sin(walkT))*.04*Math.min(sp/6,1):0; model.rotation.x=Math.min(sp*.012,.12);
  updateCustom(dt);
  if(state==='play'||state==='count') player.visible=invuln<=0||((time*18)|0)%2===0;
  if(starT>0){ mTeal.emissive.setHSL((time*1.5)%1,.9,.45); mTeal.emissiveIntensity=1; } else { mTeal.emissive.setHex(T.pem||0); mTeal.emissiveIntensity=T.pem?.9:0; }
  trailT-=dt; dustT-=dt;
  if(playing&&trailT<=0&&starT>0){ trailT=.04; emit(p.x,p.y+.4,p.z,0,.2,0,starT>0?RAINBOW[Math.floor(time*20)%5]:0x7ff3ff,.35,1.5,0); }

  /* screen effects */
  const spT=clamp((sp-5.5)/6,0,.6)+(starT>0?.25:0); speedOp+=(spT-speedOp)*Math.min(1,8*rdt); $('speed').style.opacity=playing?speedOp:0;
  flashA=Math.max(0,flashA-rdt*2.2); $('flash').style.opacity=flashA;
  const fovT=BASE_FOV+clamp(sp,0,12)*.9+(starT>0?6:0); if(Math.abs(fovT-camera.fov)>.05){ camera.fov+=(fovT-camera.fov)*Math.min(1,6*rdt); camera.updateProjectionMatrix(); }

  /* camera */
  if(charEd) charCam(); else if(state==='menu'||state==='brief') orbitCam();
  else {
    const k=state==='count'?clamp(countT/3.6,0,1):0, dist=9+k*14, pt=pitch+k*.45;
    const tgt=new THREE.Vector3(p.x,p.y+1.3,p.z), cp=Math.cos(pt);
    const des=new THREE.Vector3(tgt.x+Math.sin(yaw)*cp*dist,tgt.y+Math.sin(pt)*dist,tgt.z+Math.cos(yaw)*cp*dist);
    camPos.lerp(des,1-Math.exp(-9*rdt)); camera.position.copy(camPos);
    if(shakeAmt>.01){ camera.position.x+=(Math.random()-.5)*shakeAmt; camera.position.y+=(Math.random()-.5)*shakeAmt; camera.position.z+=(Math.random()-.5)*shakeAmt; }
    camera.lookAt(tgt);
  }
  shakeAmt*=Math.exp(-6*rdt);
  sky.position.copy(camera.position);
  fill.position.set(camera.position.x,camera.position.y+2,camera.position.z); fill.target.position.set(p.x,p.y+1,p.z); fill.intensity=T.fill===undefined?.3:T.fill; fill.color.setHex(T.sunHex);
  const sd=skyU.sunDir.value; sun.position.set(p.x+sd.x*60,p.y+sd.y*60,p.z+sd.z*60); sun.target.position.set(p.x,p.y,p.z);
  if(hudVis) hud();
}

/* ================= Loop ================= */
let last=performance.now();
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(.05,(now-last)/1000); last=now; update(dt); musicTick(); renderer.render(scene,camera); }
startMenuScene(); requestAnimationFrame(loop);
})();
</script>
