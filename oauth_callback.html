<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koneksi Berhasil — Runnerflo Composio Hub</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 20px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.12);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 10px 16px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h2>Autentikasi Berhasil!</h2>
    <p>Akun Anda telah berhasil terhubung dengan platform otonom melalui Composio Managed OAuth.</p>
    <div class="status-badge">
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981"></span>
      Sesi Aktif &bull; Sinkronisasi Otomatis
    </div>
    <button class="btn" onclick="finishAndClose()">Kembali ke Aplikasi (Tutup)</button>
  </div>

  <script>
    function finishAndClose() {
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: 'COMPOSIO_AUTH_SUCCESS',
            status: 'CONNECTED',
            appName: 'google',
            timestamp: Date.now()
          }, '*');
        }
      } catch(e) {}
      setTimeout(function() {
        try { window.close(); } catch(e){}
      }, 300);
    }

    // Auto-notify opener immediately
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          type: 'COMPOSIO_AUTH_SUCCESS',
          status: 'CONNECTED',
          appName: 'google',
          timestamp: Date.now()
        }, '*');
      }
    } catch(e) {}

    // Auto close after 1.5s
    setTimeout(function() {
      try { window.close(); } catch(e){}
    }, 1500);
  </script>
</body>
</html>
