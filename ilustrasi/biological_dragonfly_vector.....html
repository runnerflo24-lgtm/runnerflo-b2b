<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biological Dragonfly Vector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG visual interaction and subtle shimmer effects */
        .dragonfly-svg {
            width: 100%;
            height: 100%;
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.15));
            transition: filter 0.4s ease;
        }

        .wing-shimmer {
            transition: opacity 0.4s ease, filter 0.4s ease;
        }

        .dragonfly-svg:hover .wing-shimmer {
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.7));
        }
    </style>
</head>
<body>

    <svg id="dragonflySvg" class="dragonfly-svg" viewBox="0 0 800 900" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Body Gradients -->
            <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0f766e" />
                <stop offset="50%" stop-color="#14b8a6" />
                <stop offset="100%" stop-color="#042f2e" />
            </linearGradient>

            <radialGradient id="eyeGradLeft" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#2dd4bf" />
                <stop offset="40%" stop-color="#0f766e" />
                <stop offset="85%" stop-color="#022c22" />
                <stop offset="100%" stop-color="#000000" />
            </radialGradient>

            <radialGradient id="eyeGradRight" cx="60%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#2dd4bf" />
                <stop offset="40%" stop-color="#0f766e" />
                <stop offset="85%" stop-color="#022c22" />
                <stop offset="100%" stop-color="#000000" />
            </radialGradient>

            <linearGradient id="thoraxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#134e4a" />
                <stop offset="35%" stop-color="#0d9488" />
                <stop offset="70%" stop-color="#115e59" />
                <stop offset="100%" stop-color="#022c22" />
            </linearGradient>

            <linearGradient id="abdomenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#0f766e" />
                <stop offset="20%" stop-color="#0284c7" />
                <stop offset="50%" stop-color="#0369a1" />
                <stop offset="80%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#0284c7" />
            </linearGradient>

            <!-- Iridescent Wing Gradients -->
            <linearGradient id="wingBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
                <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.55" />
                <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.4" />
                <stop offset="75%" stop-color="#ccfbf1" stop-opacity="0.5" />
                <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.65" />
            </linearGradient>

            <linearGradient id="wingHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
                <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
                <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.4" />
            </linearGradient>

            <!-- Soft Depth Filter -->
            <filter id="wingGlow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.15" />
            </filter>
        </defs>
