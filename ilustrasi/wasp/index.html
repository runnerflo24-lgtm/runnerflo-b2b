<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasp Vector Illustration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Pure Wasp Graphic Responsive Styling */
        svg#wasp {
            width: 90vw;
            height: 90vh;
            max-width: 800px;
            max-height: 800px;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.4));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        svg#wasp:active {
            transform: scale(0.97);
        }

        /* Minimal subtle copy-feedback indicator */
        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.9);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 8px 18px;
            border-radius: 9999px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- WASP VECTOR GRAPHIC -->
    <svg id="wasp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
        <defs>
            <!-- Body Gradients -->
            <radialGradient id="headGrad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#3a2f25"/>
                <stop offset="60%" stop-color="#1c1610"/>
                <stop offset="100%" stop-color="#0a0806"/>
            </radialGradient>

            <radialGradient id="eyeGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#603212"/>
                <stop offset="50%" stop-color="#281204"/>
                <stop offset="100%" stop-color="#050200"/>
            </radialGradient>

            <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fcd34d"/>
                <stop offset="50%" stop-color="#f59e0b"/>
                <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>

            <linearGradient id="yellowHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#fef08a"/>
                <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>

            <radialGradient id="thoraxGrad" cx="40%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#4a3b2c"/>
                <stop offset="50%" stop-color="#211a12"/>
                <stop offset="100%" stop-color="#0a0805"/>
            </radialGradient>

            <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#92400e"/>
                <stop offset="50%" stop-color="#451a03"/>
                <stop offset="100%" stop-color="#180901"/>
            </linearGradient>

            <!-- Wing Gradients -->
            <linearGradient id="wingGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="rgba(254, 243, 199, 0.6)"/>
                <stop offset="40%" stop-color="rgba(224, 231, 255, 0.4)"/>
                <stop offset="80%" stop-color="rgba(199, 210, 254, 0.3)"/>
                <stop offset="100%" stop-color="rgba(245, 158, 11, 0.45)"/>
            </linearGradient>

            <linearGradient id="wingGradSub" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="rgba(255, 255, 255, 0.5)"/>
                <stop offset="70%" stop-color="rgba(217, 119, 6, 0.25)"/>
                <stop offset="100%" stop-color="rgba(180, 83, 9, 0.35)"/>
            </linearGradient>

            <linearGradient id="stingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#451a03"/>
                <stop offset="50%" stop-color="#0f172a"/>
                <stop offset="100%" stop-color="#000000"/>
            </linearGradient>

            <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
            </filter>
        </defs>

        <!-- 4. HEAD -->
        <g id="head" filter="url(#softShadow)">

            <path d="M 370 210 Q 400 195 430 210 Q 440 235 425 255 Q 400 268 375 255 Q 360 235 370 210 Z" fill="url(#yellowGrad)"/>

            <!-- Mandibles -->

            <circle cx="400" cy="192" r="3" fill="#fbbf24"/>
            <circle cx="391" cy="197" r="3" fill="#fbbf24"/>
            <circle cx="409" cy="197" r="3" fill="#fbbf24"/>

            <!-- Antennae -->
            <g>
                <path d="M 382 212 L 350 180" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>

    <!-- Subtle feedback alert -->
    <div id="toast" class="toast">SVG Copied!</div>

    <script>
        const waspSvg = document.getElementById('wasp');
        const toast = document.getElementById('toast');
        let timeoutId;

        // Click anywhere to copy pure SVG code
        document.body.addEventListener('click', () => {
            const svgContent = waspSvg.outerHTML;
            
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = svgContent;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                document.execCommand('copy');
                
                // Show subtle feedback
                toast.classList.add('show');
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1800);
            } catch (err) {
                // Silent fail or fallback
            }
            
            document.body.removeChild(tempTextArea);
        });
    </script>
</body>
</html>
