<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biological Louse Vector Graphic</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent !important;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: 100%;
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.35));
        }
    </style>
</head>
<body>
    <svg id="louse-graphic" viewBox="0 0 600 850" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="headGrad" x1="300" y1="100" x2="300" y2="200" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#a35218"/>
                <stop offset="50%" stop-color="#7c3a0d"/>
                <stop offset="100%" stop-color="#4a1e02"/>
            </linearGradient>

            <linearGradient id="thoraxGrad" x1="300" y1="190" x2="300" y2="330" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#b8611b"/>
                <stop offset="50%" stop-color="#8c4311"/>
                <stop offset="100%" stop-color="#542304"/>
            </linearGradient>

            <radialGradient id="abdomenGrad" cx="300" cy="520" r="220" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#d97724"/>
                <stop offset="55%" stop-color="#a35218"/>
                <stop offset="85%" stop-color="#6e2d05"/>
                <stop offset="100%" stop-color="#3d1400"/>
            </radialGradient>

            <linearGradient id="segmentPlate" x1="200" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#4a1d03" stop-opacity="0.85"/>
                <stop offset="20%" stop-color="#9e4e13" stop-opacity="0.95"/>
                <stop offset="50%" stop-color="#cb6e20" stop-opacity="1"/>
                <stop offset="80%" stop-color="#9e4e13" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#4a1d03" stop-opacity="0.85"/>
            </linearGradient>

            <linearGradient id="legGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#c46a25"/>
                <stop offset="60%" stop-color="#8a3e0c"/>
                <stop offset="100%" stop-color="#421601"/>
            </linearGradient>

            <linearGradient id="clawGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#5a2403"/>
                <stop offset="100%" stop-color="#1c0700"/>
            </linearGradient>

            <radialGradient id="gutGrad" cx="300" cy="500" r="140" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1f0700" stop-opacity="0.9"/>
                <stop offset="70%" stop-color="#4a1902" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#8a3e0c" stop-opacity="0"/>
            </radialGradient>
        </defs>

        <!-- Abdomen Body -->
        <path d="M 210,300 C 130,340 100,430 100,530 C 100,660 160,750 250,780 C 280,790 292,800 300,808 C 308,800 320,790 350,780 C 440,750 500,660 500,530 C 500,430 470,340 390,300 C 340,315 260,315 210,300 Z" 
              fill="url(#abdomenGrad)" stroke="#260c00" stroke-width="4"/>

        <!-- Internal Digestive System Impression -->
        <path d="M 240,360 Q 300,340 360,360 Q 420,450 400,580 Q 300,680 200,580 Q 180,450 240,360 Z" fill="url(#gutGrad)"/>

        <!-- Segments & Lateral Pleural Plates -->
        <!-- Segment 1 -->
        <path d="M 190,350 Q 300,380 410,350 Q 428,385 432,410 Q 300,440 168,410 Q 172,385 190,350 Z" fill="url(#segmentPlate)" stroke="#2d0f00" stroke-width="2"/>
        <circle cx="182" cy="380" r="4" fill="#120600"/>
        <circle cx="418" cy="380" r="4" fill="#120600"/>

        <!-- Segment 2 -->
        <path d="M 162,420 Q 300,450 438,420 Q 444,455 445,480 Q 300,510 155,480 Q 156,455 162,420 Z" fill="url(#segmentPlate)" stroke="#2d0f00" stroke-width="2"/>
        <circle cx="170" cy="450" r="4.5" fill="#120600"/>
        <circle cx="430" cy="450" r="4.5" fill="#120600"/>

        <!-- Segment 3 -->
        <path d="M 152,490 Q 300,520 448,490 Q 448,525 444,550 Q 300,580 156,550 Q 152,525 152,490 Z" fill="url(#segmentPlate)" stroke="#2d0f00" stroke-width="2"/>
        <circle cx="162" cy="520" r="4.5" fill="#120600"/>
        <circle cx="438" cy="520" r="4.5" fill="#120600"/>

        <!-- Segment 4 -->
        <path d="M 155,560 Q 300,590 445,560 Q 438,595 430,620 Q 300,650 170,620 Q 162,595 155,560 Z" fill="url(#segmentPlate)" stroke="#2d0f00" stroke-width="2"/>
        <circle cx="168" cy="590" r="4.5" fill="#120600"/>
        <circle cx="432" cy="590" r="4.5" fill="#120600"/>

        <!-- Segment 5 -->
        <path d="M 172,630 Q 300,660 428,630 Q 418,660 400,685 Q 300,715 200,685 Q 182,660 172,630 Z" fill="url(#segmentPlate)" stroke="#2d0f00" stroke-width="2"/>
        <circle cx="188" cy="658" r="4" fill="#120600"/>
        <circle cx="412" cy="658" r="4" fill="#120600"/>

        <!-- Segment 6 -->
        <path d="M 205,695 Q 300,725 395,695 Q 375,740 340,765 Q 300,775 260,765 Q 225,740 205,695 Z" fill="url(#segmentPlate)" stroke="#2d0f00" stroke-width="2"/>

        <!-- Micro-hairs / Setae -->
        <g stroke="#3a1804" stroke-width="1.5" stroke-linecap="round">
            <line x1="120" y1="450" x2="100" y2="445"/><line x1="112" y1="500" x2="90" y2="498"/><line x1="115" y1="550" x2="92" y2="552"/>
            <line x1="125" y1="600" x2="102" y2="608"/><line x1="145" y1="660" x2="125" y2="672"/><line x1="180" y1="720" x2="162" y2="738"/>
            <line x1="480" y1="450" x2="500" y2="445"/><line x1="488" y1="500" x2="510" y2="498"/><line x1="485" y1="550" x2="508" y2="552"/>
            <line x1="475" y1="600" x2="498" y2="608"/><line x1="455" y1="660" x2="475" y2="672"/><line x1="420" y1="720" x2="438" y2="738"/>
            <line x1="250" y1="395" x2="250" y2="410"/><line x1="300" y1="398" x2="300" y2="413"/><line x1="350" y1="395" x2="350" y2="410"/>
            <line x1="230" y1="465" x2="230" y2="480"/><line x1="280" y1="468" x2="280" y2="483"/><line x1="320" y1="468" x2="320" y2="483"/><line x1="370" y1="465" x2="370" y2="480"/>
            <line x1="240" y1="535" x2="240" y2="550"/><line x1="300" y1="538" x2="300" y2="553"/><line x1="360" y1="535" x2="360" y2="550"/>
            <line x1="250" y1="605" x2="250" y2="620"/><line x1="300" y1="608" x2="300" y2="623"/><line x1="350" y1="605" x2="350" y2="620"/>
        </g>

        <!-- Thorax -->
        <path d="M 230,200 C 230,170 370,170 370,200 C 400,220 420,260 400,310 C 350,325 250,325 200,310 C 180,260 200,220 230,200 Z" 
              fill="url(#thoraxGrad)" stroke="#260c00" stroke-width="4"/>
        
        <path d="M 240,240 Q 300,260 360,240" fill="none" stroke="#3d1802" stroke-width="3" stroke-linecap="round"/>
        <path d="M 220,280 Q 300,305 380,280" fill="none" stroke="#3d1802" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="300" y1="185" x2="300" y2="310" stroke="#260c00" stroke-width="2.5" stroke-dasharray="6,4"/>

        <!-- Thoracic Spiracles -->
        <circle cx="225" cy="255" r="5" fill="#120600" stroke="#6e3108" stroke-width="1.5"/>
        <circle cx="375" cy="255" r="5" fill="#120600" stroke="#6e3108" stroke-width="1.5"/>

        <!-- Head -->
        <path d="M 250,175 C 240,140 250,100 270,85 C 285,74 315,74 330,85 C 350,100 360,140 350,175 C 320,185 280,185 250,175 Z" 
              fill="url(#headGrad)" stroke="#260c00" stroke-width="3.5"/>

        <circle cx="254" cy="125" r="6" fill="#0a0300" stroke="#8c4311" stroke-width="1.5"/>
        <circle cx="346" cy="125" r="6" fill="#0a0300" stroke="#8c4311" stroke-width="1.5"/>
        <circle cx="253" cy="124" r="2" fill="#ffffff" opacity="0.7"/>
        <circle cx="345" cy="124" r="2" fill="#ffffff" opacity="0.7"/>

        <!-- Mouthparts -->
        <path d="M 292,80 L 295,55 L 305,55 L 308,80 Z" fill="#361401" stroke="#1a0800" stroke-width="1.5"/>
        <path d="M 297,55 L 300,42 L 303,55 Z" fill="#1a0800"/>

        <!-- Antenna Left -->
        <g>
            <path d="M 252,110 L 225,102" stroke="url(#legGrad)" stroke-width="9" stroke-linecap="round"/>
            <path d="M 225,102 L 202,96" stroke="url(#legGrad)" stroke-width="8" stroke-linecap="round"/>
            <path d="M 202,96 L 182,92" stroke="url(#legGrad)" stroke-width="7" stroke-linecap="round"/>
            <path d="M 182,92 L 167,90" stroke="url(#legGrad)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 167,90 L 152,90" stroke="url(#legGrad)" stroke-width="5" stroke-linecap="round"/>
            <line x1="152" y1="90" x2="144" y2="87" stroke="#3a1804" stroke-width="1.5"/>
            <line x1="152" y1="90" x2="144" y2="93" stroke="#3a1804" stroke-width="1.5"/>
        </g>

        <!-- Antenna Right -->
        <g>
            <path d="M 348,110 L 375,102" stroke="url(#legGrad)" stroke-width="9" stroke-linecap="round"/>
            <path d="M 375,102 L 398,96" stroke="url(#legGrad)" stroke-width="8" stroke-linecap="round"/>
            <path d="M 398,96 L 418,92" stroke="url(#legGrad)" stroke-width="7" stroke-linecap="round"/>
            <path d="M 418,92 L 433,90" stroke="url(#legGrad)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 433,90 L 448,90" stroke="url(#legGrad)" stroke-width="5" stroke-linecap="round"/>
            <line x1="448" y1="90" x2="456" y2="87" stroke="#3a1804" stroke-width="1.5"/>
            <line x1="448" y1="90" x2="456" y2="93" stroke="#3a1804" stroke-width="1.5"/>
        </g>

        <!-- Pair 1 Legs (Front) -->
        <g class="leg">
            <path d="M 235,210 Q 190,195 160,205" fill="none" stroke="url(#legGrad)" stroke-width="16" stroke-linecap="round"/>
            <path d="M 160,205 Q 120,215 95,190" fill="none" stroke="url(#legGrad)" stroke-width="14" stroke-linecap="round"/>
            <path d="M 95,190 Q 75,160 85,130" fill="none" stroke="url(#legGrad)" stroke-width="11" stroke-linecap="round"/>
            <path d="M 85,145 Q 98,140 102,130" fill="none" stroke="url(#legGrad)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 85,130 Q 88,100 68,90 C 55,85 50,105 65,122 Z" fill="url(#clawGrad)" stroke="#100500" stroke-width="1.5"/>
        </g>
        <g class="leg">
            <path d="M 365,210 Q 410,195 440,205" fill="none" stroke="url(#legGrad)" stroke-width="16" stroke-linecap="round"/>
            <path d="M 440,205 Q 480,215 505,190" fill="none" stroke="url(#legGrad)" stroke-width="14" stroke-linecap="round"/>
            <path d="M 505,190 Q 525,160 515,130" fill="none" stroke="url(#legGrad)" stroke-width="11" stroke-linecap="round"/>
            <path d="M 515,145 Q 502,140 498,130" fill="none" stroke="url(#legGrad)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 515,130 Q 512,100 532,90 C 545,85 550,105 535,122 Z" fill="url(#clawGrad)" stroke="#100500" stroke-width="1.5"/>
        </g>

        <!-- Pair 2 Legs (Middle) -->
        <g class="leg">
            <path d="M 220,255 Q 165,250 135,270" fill="none" stroke="url(#legGrad)" stroke-width="18" stroke-linecap="round"/>
            <path d="M 135,270 Q 90,295 65,275" fill="none" stroke="url(#legGrad)" stroke-width="15" stroke-linecap="round"/>
            <path d="M 65,275 Q 40,250 50,215" fill="none" stroke="url(#legGrad)" stroke-width="12" stroke-linecap="round"/>
            <path d="M 52,230 Q 66,228 72,218" fill="none" stroke="url(#legGrad)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 50,215 Q 50,180 30,175 C 18,172 18,195 32,210 Z" fill="url(#clawGrad)" stroke="#100500" stroke-width="1.5"/>
        </g>
        <g class="leg">
            <path d="M 380,255 Q 435,250 465,270" fill="none" stroke="url(#legGrad)" stroke-width="18" stroke-linecap="round"/>
            <path d="M 465,270 Q 510,295 535,275" fill="none" stroke="url(#legGrad)" stroke-width="15" stroke-linecap="round"/>
            <path d="M 535,275 Q 560,250 550,215" fill="none" stroke="url(#legGrad)" stroke-width="12" stroke-linecap="round"/>
            <path d="M 548,230 Q 534,228 528,218" fill="none" stroke="url(#legGrad)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 550,215 Q 550,180 570,175 C 582,172 582,195 568,210 Z" fill="url(#clawGrad)" stroke="#100500" stroke-width="1.5"/>
        </g>

        <!-- Pair 3 Legs (Hind) -->
        <g class="leg">
            <path d="M 215,295 Q 160,315 125,350" fill="none" stroke="url(#legGrad)" stroke-width="19" stroke-linecap="round"/>
            <path d="M 125,350 Q 80,390 55,370" fill="none" stroke="url(#legGrad)" stroke-width="16" stroke-linecap="round"/>
            <path d="M 55,370 Q 30,345 42,305" fill="none" stroke="url(#legGrad)" stroke-width="12" stroke-linecap="round"/>
            <path d="M 43,322 Q 58,320 64,310" fill="none" stroke="url(#legGrad)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 42,305 Q 40,265 20,265 C 8,265 10,288 25,302 Z" fill="url(#clawGrad)" stroke="#100500" stroke-width="1.5"/>
        </g>
        <g class="leg">
            <path d="M 385,295 Q 440,315 475,350" fill="none" stroke="url(#legGrad)" stroke-width="19" stroke-linecap="round"/>
            <path d="M 475,350 Q 520,390 545,370" fill="none" stroke="url(#legGrad)" stroke-width="16" stroke-linecap="round"/>
            <path d="M 545,370 Q 570,345 558,305" fill="none" stroke="url(#legGrad)" stroke-width="12" stroke-linecap="round"/>
            <path d="M 557,322 Q 542,320 536,310" fill="none" stroke="url(#legGrad)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 558,305 Q 560,265 580,265 C 592,265 590,288 575,302 Z" fill="url(#clawGrad)" stroke="#100500" stroke-width="1.5"/>
        </g>

        <!-- Leg Spines -->
        <g stroke="#260c00" stroke-width="2" stroke-linecap="round">
            <line x1="140" y1="200" x2="135" y2="188"/>
            <line x1="110" y1="210" x2="102" y2="200"/>
            <line x1="110" y1="260" x2="102" y2="250"/>
            <line x1="80" y1="285" x2="70" y2="280"/>
            <line x1="100" y1="335" x2="90" y2="325"/>
            <line x1="70" y1="380" x2="58" y2="385"/>
            <line x1="460" y1="200" x2="465" y2="188"/>
            <line x1="490" y1="210" x2="498" y2="200"/>
            <line x1="490" y1="260" x2="498" y2="250"/>
            <line x1="520" y1="285" x2="530" y2="280"/>
            <line x1="500" y1="335" x2="510" y2="325"/>
            <line x1="530" y1="380" x2="542" y2="385"/>
        </g>
    </svg>
</body>
</html>
