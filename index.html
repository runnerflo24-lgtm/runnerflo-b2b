<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buat Aplikasi AI Mu Sendiri</title>
<style>
:root{
  --bg:#fcfcfc; --text:#0d0d0d; --muted:#8e8e8e; --border:#e5e5e5; --soft:#f3f3f3;
  --btn:#0d0d0d; --btn-text:#ffffff; --send:#9fa9f7; --send-on:#0d0d0d; --send-on-text:#fff;
  --glow:rgba(0,0,0,.025);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#212121; --text:#f4f4f4; --muted:#9b9b9b; --border:#3a3a3a; --soft:#2f2f2f;
    --btn:#f4f4f4; --btn-text:#0d0d0d; --send:#5c64b5; --send-on:#f4f4f4; --send-on-text:#0d0d0d;
    --glow:rgba(255,255,255,.02);
  }
}
:root[data-theme="dark"]{
  --bg:#212121; --text:#f4f4f4; --muted:#9b9b9b; --border:#3a3a3a; --soft:#2f2f2f;
  --btn:#f4f4f4; --btn-text:#0d0d0d; --send:#5c64b5; --send-on:#f4f4f4; --send-on-text:#0d0d0d;
  --glow:rgba(255,255,255,.02);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  display:flex;
}
svg{display:block}
.side{
  width:84px;flex:none;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;align-self:flex-start;
  display:flex;flex-direction:column;align-items:center;padding-top:22px;gap:0;
}
.side .logo{width:36px;height:36px;margin-bottom:26px}
.side button{
  width:40px;height:40px;margin-bottom:14px;border:0;background:none;color:var(--text);
  border-radius:10px;display:grid;place-items:center;cursor:pointer;
}
.side button:hover{background:var(--soft)}
.side button:focus-visible,.pill:focus-visible,.chip:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--send);outline-offset:2px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:flex;justify-content:flex-end;gap:12px;padding:13px 16px 0}
.pill{
  height:52px;padding:0 18px;border-radius:999px;font-weight:600;font-size:19px;line-height:1;font-family:inherit;
  cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text);
}
.pill.dark{background:var(--btn);color:var(--btn-text);border-color:var(--btn);padding:0 17px}
.center{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 24px 90px;
}
.glow{
  width:100%;max-width:1160px;display:flex;flex-direction:column;align-items:center;
  padding:36px 0 36px;border-radius:200px;
  background:radial-gradient(ellipse at center,var(--glow) 0,transparent 70%);
}
.hero{margin:0 0 26px;text-align:center;width:100%;max-width:1152px}
h1{
  margin:0 0 8px;
  font-size:clamp(18px,2.05vw,27px);
  line-height:1.35;
  font-weight:450;
  letter-spacing:-.015em;
  color:var(--text);
}
@media (min-width:860px){
  h1{white-space:nowrap}
}
.type-wrap{display:flex;align-items:center;justify-content:center;min-height:1.4em}
.type{
  margin:0;
  font-size:clamp(18px,2.05vw,27px);
  line-height:1.35;
  font-weight:600;
  letter-spacing:-.015em;
  color:var(--text);
  display:inline-block;
  min-height:1.35em;
}
.cursor{
  display:inline-block;
  width:2px;
  height:1.15em;
  margin-left:3px;
  background:currentColor;
  vertical-align:-.14em;
  animation:blink 1s steps(1) infinite;
}
@media (max-width:820px){
  h1,.type{font-size:clamp(17px,2.2vw,23px)}
  .type-wrap{min-height:1.45em}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
.box{
  width:100%;max-width:1152px;height:78px;border:1px solid var(--border);border-radius:999px;
  background:var(--bg);display:flex;align-items:center;gap:14px;padding:0 15px 0 27px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.icon-btn{border:0;background:none;color:var(--text);cursor:pointer;display:grid;place-items:center;padding:0;border-radius:50%}
.box input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);
  font-weight:400;font-size:24px;line-height:1;font-family:inherit;padding:0 0 0 2px;
}
.box input::placeholder{color:var(--muted)}
.send{
  width:50px;height:50px;border-radius:50%;border:0;background:var(--send);color:#fff;
  display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s;
}
.send.on{background:var(--send-on);color:var(--send-on-text)}
.chips-wrap{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:16px;flex-wrap:wrap;
}
.chip{
  height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-weight:500;font-size:15px;line-height:1;
  font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  transition:all .15s ease;
  text-decoration:none;
}
.chip:hover,.pill:not(.dark):hover{background:var(--soft);border-color:var(--text)}
.chip svg{color:var(--muted);transition:color .15s;flex-shrink:0}
.chip:hover svg{color:var(--text)}
.foot{
  position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:17px;color:#666;
  padding:0 16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .foot{color:#a5a5a5}}
:root[data-theme="dark"] .foot{color:#a5a5a5}
.foot a{color:inherit;text-decoration:underline}
.first{position:relative;height:100vh;height:100svh;min-height:620px;display:flex;flex-direction:column}
.demo{padding:72px 24px 96px;display:flex;flex-direction:column;align-items:center;border-top:1px solid var(--border)}
.demo-head{text-align:center;margin-bottom:28px;max-width:720px}
.demo h2{margin:0;font-size:clamp(22px,2.2vw,30px);font-weight:500;letter-spacing:-.01em}
.demo-head p{margin:8px 0 0;color:var(--muted);font-size:clamp(15px,1.5vw,18px)}
.frame{width:100%;max-width:1152px;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--bg);box-shadow:0 8px 30px rgba(0,0,0,.07);transition:box-shadow .2s}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:46px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--soft);position:relative;z-index:2}
.bar-dots{display:flex;align-items:center;gap:7px;flex:none}
.bar-dots i{width:12px;height:12px;border-radius:50%;cursor:pointer;transition:transform .15s,opacity .15s}
.bar-dots .dot-red{background:#ff5f56;opacity:.85}.bar-dots .dot-yellow{background:#ffbd2e;opacity:.85}.bar-dots .dot-green{background:#27c93f;opacity:.85}
.bar-dots i:hover{transform:scale(1.2);opacity:1}
.bar-url{font-size:13.5px;font-weight:500;color:var(--muted);background:var(--bg);padding:4px 18px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.bar-actions{display:flex;align-items:center;gap:8px;flex:none}
.stage-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;transition:all .15s;text-decoration:none}
.stage-btn:hover{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.stage-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--soft);color:var(--muted)}
.stage-btn:hover .stage-tag{background:rgba(255,255,255,.2);color:inherit}
.stage-btn.restore-btn{background:var(--soft);color:var(--muted)}
.stage-btn.restore-btn:hover{background:#ff5f56;color:#fff;border-color:#ff5f56}
.frame iframe{display:block;width:100%;height:760px;border:0;background:var(--bg)}
/* Stage 1: Penuh menutup area chat AI / konten utama, navbar kiri tetap terlihat */
.frame.stage-1{position:fixed!important;top:0!important;right:0!important;bottom:0!important;left:84px!important;width:auto!important;max-width:none!important;height:100vh!important;height:100dvh!important;z-index:38!important;border-radius:0!important;margin:0!important;border:none!important;box-shadow:0 0 60px rgba(0,0,0,.5)!important;display:flex!important;flex-direction:column!important;animation:exp1 .22s cubic-bezier(.16,1,.3,1)}
@media (min-width:821px){.frame.stage-1{left:64px!important}}
@media (max-width:820px){.frame.stage-1{left:0!important}}
.frame.stage-1 iframe{flex:1!important;height:calc(100% - 46px)!important;width:100%!important}
/* Stage 2: Memenuhi luas semuanya (100vw x 100vh) termasuk navbar kiri */
.frame.stage-2{position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100vw!important;max-width:none!important;height:100vh!important;height:100dvh!important;z-index:9999!important;border-radius:0!important;margin:0!important;border:none!important;box-shadow:0 0 80px rgba(0,0,0,.7)!important;display:flex!important;flex-direction:column!important;animation:exp2 .22s cubic-bezier(.16,1,.3,1)}
.frame.stage-2 iframe{flex:1!important;height:calc(100% - 46px)!important;width:100%!important}
@keyframes exp1{from{opacity:.9;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes exp2{from{opacity:.9;transform:scale(.985)}to{opacity:1;transform:none}}
.price{padding:72px 24px 104px;display:flex;flex-direction:column;align-items:center;border-top:1px solid var(--border)}
.price h2{margin:0;font-size:clamp(22px,2.2vw,30px);font-weight:500;letter-spacing:-.01em}
.plans{width:100%;max-width:1152px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.plan{border:1px solid var(--border);border-radius:24px;padding:32px;display:flex;flex-direction:column;background:var(--bg)}
.plan .tag{font-size:16px;font-weight:600}
.plan .note{color:var(--muted);font-size:15px;margin-top:2px}
.amount{margin:22px 0 0;font-size:clamp(40px,4.6vw,56px);font-weight:600;letter-spacing:-.03em;line-height:1}
.amount small{font-size:16px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:8px}
.plan ul{list-style:none;margin:24px 0;padding:0;display:flex;flex-direction:column;gap:12px}
.plan li{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4}
.plan li svg{flex:none;margin-top:2px}
.guar{background:var(--soft);border-radius:16px;padding:16px 18px;margin-bottom:24px;font-size:15px;line-height:1.5;color:var(--muted)}
.guar b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.cta{margin-top:auto;display:grid;place-items:center;height:56px;border-radius:999px;background:var(--btn);color:var(--btn-text);font-weight:600;font-size:18px;text-decoration:none}
.cta:focus-visible{outline:2px solid var(--send);outline-offset:2px}
.plans{margin-top:14px}
.plan{position:relative}
.plan.main{border:2px solid var(--text)}
.badge{position:absolute;top:-14px;left:30px;background:var(--btn);color:var(--btn-text);font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px}
.per{margin-top:8px;color:var(--muted);font-size:15px}
.cta.alt{background:transparent;color:var(--text);border:1px solid var(--border)}
.cta.alt:hover{background:var(--soft)}
/* Vercel-Style Formal Partner Verification Note */
.partner-note{width:100%;max-width:1152px;margin-top:22px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--muted);line-height:1.5;text-align:center}
.partner-note svg{flex:none;color:var(--muted);opacity:.85}
.partner-note b{color:var(--text);font-weight:600}
@media (max-width:680px){.partner-note{font-size:12.5px;justify-content:flex-start;text-align:left;padding:0 4px}}
mark{color:#0d0d0d;font-weight:600;padding:0 .18em;margin:0 -.04em;border-radius:.25em .5em .3em .45em;background:linear-gradient(transparent 32%,#ffe14d 32%,#ffe14d 92%,transparent 92%) no-repeat;background-size:0% 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:hl .9s .35s ease-out forwards}
@keyframes hl{to{background-size:100% 100%}}
@media (prefers-reduced-motion:reduce){mark{animation:none;background-size:100% 100%}}
.side{z-index:40}
.side .logo{cursor:pointer}
.side button::after{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--btn);color:var(--btn-text);font-size:13px;font-weight:500;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.side button:hover::after,.side button:focus-visible::after{opacity:1}
.dcard.wide{width:min(560px,calc(100vw - 32px))}
.ixd{width:min(1160px,calc(100vw - 32px));height:min(780px,calc(100dvh - 32px));max-height:none;margin:auto}
.ixm{position:relative;display:grid;grid-template-columns:272px minmax(0,1fr);height:100%;background:var(--bg);border:1px solid var(--border);border-radius:26px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.32)}
.ixd[open] .ixm{animation:ixin .24s cubic-bezier(.2,.8,.2,1)}
@keyframes ixin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ixd[open] .ixm{animation:none}}
.ixs{display:flex;flex-direction:column;min-height:0;padding:28px 14px 16px;border-right:1px solid var(--border);background:var(--soft)}
.ixs h3{margin:0 12px;font-size:23px;font-weight:700;letter-spacing:-.02em}
.ixs p{margin:8px 12px 18px;color:var(--muted);font-size:14px;line-height:1.5}
#icat{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0;padding-bottom:4px}
.cat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;color:var(--text);padding:10px 12px;border-radius:12px;font:inherit;font-size:14.5px;text-align:left;cursor:pointer}
.cat span{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.cat:hover{background:var(--border)}
.cat.on{background:var(--btn);color:var(--btn-text);font-weight:600}.cat.on span{color:inherit;opacity:.7}
.cat:focus-visible,.idea:focus-visible,.ixsr input:focus-visible{outline:2px solid var(--send);outline-offset:2px}
.ixc{display:flex;flex-direction:column;min-height:0;min-width:0}
.ixh{display:flex;align-items:center;gap:16px;padding:22px 66px 16px 26px}
.ixsr{position:relative;flex:1;min-width:0}
.ixsr svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.ixsr input{width:100%;height:48px;border:1px solid var(--border);border-radius:999px;background:var(--soft);color:var(--text);padding:0 18px 0 46px;font:inherit;font-size:16px;outline:0}
.ixsr input:focus{border-color:var(--text);background:var(--bg)}
#ic{flex:none;color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ixg{flex:1;min-height:0;overflow:auto;padding:4px 26px 26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px;align-content:start;overscroll-behavior:contain}
.idea{display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:16px;padding:14px 16px 15px;font-family:inherit;cursor:pointer;transition:transform .14s,border-color .14s,box-shadow .14s}
.idea:hover{border-color:var(--text);transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.09)}
.idea i{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.idea b{font-size:16px;font-weight:650;line-height:1.3;letter-spacing:-.005em}
.idea small{font-size:14px;color:var(--muted);line-height:1.35}
.iempty{grid-column:1/-1;color:var(--muted);padding:48px 0;text-align:center}
@media (max-width:760px){
  .ixd{width:calc(100vw - 16px);height:calc(100dvh - 16px)}
  .ixm{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);border-radius:22px}
  .ixs{padding:18px 12px 10px;border-right:0;border-bottom:1px solid var(--border)}
  .ixs h3{margin:0 44px 10px 6px;font-size:20px}.ixs p{display:none}
  #icat{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .cat{flex:none;white-space:nowrap;border:1px solid var(--border);border-radius:999px;padding:8px 14px;background:var(--bg)}.cat span{display:none}
  .ixh{padding:12px 14px}#ic{display:none}
  .ixg{padding:2px 14px 18px;grid-template-columns:minmax(0,1fr)}
}

.price .demo-head{max-width:760px}
.price h2{font-size:clamp(26px,3.2vw,40px);font-weight:600;line-height:1.2}
.price .demo-head p{margin-top:12px;font-size:clamp(16px,1.7vw,20px);line-height:1.5}
.price .demo-head p b{color:var(--text);font-weight:600}
dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:none;overflow:visible}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dcard{position:relative;width:min(440px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--border);border-radius:24px;padding:40px 32px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dcard h3{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
.dcard p{margin:8px 0 24px;color:var(--muted);font-size:15.5px}
.dx{position:absolute;top:14px;right:14px;width:36px;height:36px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.dx:hover{background:var(--soft)}
.sso,.dcard input,.go{display:block;width:100%;height:52px;border-radius:999px;font-family:inherit;font-size:16px}
.sso{margin-bottom:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-weight:500;cursor:pointer}
.sso:hover{background:var(--soft)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.dcard input{border:1px solid var(--border);background:var(--bg);color:var(--text);padding:0 20px;outline:0;margin-bottom:10px}
.dcard input:focus{border-color:var(--text)}
.go{border:0;background:var(--btn);color:var(--btn-text);font-weight:600;cursor:pointer}
.sso:focus-visible,.go:focus-visible,.dx:focus-visible{outline:2px solid var(--send);outline-offset:2px}
.site{border-top:1px solid var(--border);padding:40px 24px calc(32px + env(safe-area-inset-bottom,0px))}
.fin{max-width:1152px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.fin b{display:block;font-size:17px;font-weight:600}
.fin span{color:var(--muted);font-size:14.5px}
.fin nav{display:flex;gap:24px;font-size:15px}
.fin a{color:var(--text);text-decoration:none}
.fin a:hover{text-decoration:underline}
.fsmall{max-width:1152px;margin:28px auto 0;color:var(--muted);font-size:13px;line-height:1.5;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (min-width:821px){
.side{width:64px;padding-top:16px}
.side .logo{width:28px;height:28px;margin-bottom:20px}
.side button{width:34px;height:34px;margin-bottom:10px}
.side button svg{width:21px;height:21px}
.side button::after{left:44px;font-size:12.5px}
.top{padding:10px 14px 0;gap:10px}
.pill{height:40px;padding:0 15px;font-size:15px}
.pill.dark{padding:0 14px}
.glow{max-width:1152px;padding:28px 0}
h1,.type{font-size:clamp(18px,2.05vw,27px)}
.hero{margin-bottom:24px;max-width:1152px;width:100%}
.box{max-width:900px;height:60px;gap:12px;padding:0 10px 0 20px}
.box input{font-size:17px}
.box .icon-btn svg{width:24px;height:24px}
.send{width:40px;height:40px}
.send svg{width:20px;height:20px}
.chips-wrap{margin-top:16px;gap:10px}
.chip{height:46px;padding:0 18px;font-size:15px;margin-top:0}
.foot{font-size:13px}
.center{padding-bottom:70px}
.demo,.price{padding-top:56px;padding-bottom:72px}
.demo h2{font-size:clamp(20px,1.9vw,26px)}
.demo-head p{font-size:clamp(14px,1.3vw,16px)}
