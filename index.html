<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runnerflo â€” Buat Aplikasi AI & Platform Bisnis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Runnerflo B2B Design System â€” Unified with Agent Workspace */
:root {
  --top-a: #b7b0f4;
  --top-b: #d9e4fa;
  --bg: #f4f3fb;
  --panel: #ffffff;
  --fg: #09090b;
  --muted: #334155;
  --line: #e4e2f1;
  --accent: #5646e0;
  --accent-ink: #ffffff;
  --accent-soft: #e9e6fd;
  --bubble: #e9e6fd;
  --bubble-fg: #1e1b4b;
  --dark: #09090b;
  --dark-fg: #ffffff;
  --ok: #15803d;
  --warn: #b45309;
  --warn-fg: #ffffff;
  --danger: #b91c1c;
  --s-accent: #0f766e;
  --s-soft: #ccfbf1;
  --code-bg: #09090b;
  --code-fg: #f8fafc;
  --glow: rgba(86, 70, 224, 0.08);
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  /* backwards-compatibility tokens */
  --text: var(--fg);
  --border: var(--line);
  --soft: var(--accent-soft);
  --btn: var(--accent);
  --btn-text: var(--accent-ink);
  --send: var(--accent-soft);
  --send-on: var(--accent);
  --send-on-text: var(--accent-ink);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --top-a: #2a2660; --top-b: #1d3358; --bg: #0b0a13; --panel: #141320; --fg: #ffffff; --muted: #cbd5e1;
    --line: #2c2a40; --accent: #8f84ff; --accent-ink: #0b0a13; --accent-soft: #2a2750; --bubble: #2a2750;
    --bubble-fg: #ffffff; --dark: #ffffff; --dark-fg: #0b0a13; --ok: #4ade80; --warn: #fbbf24; --warn-fg: #0b0a13;
    --danger: #f87171; --s-accent: #2dd4bf; --s-soft: #134e4a; --code-bg: #050508; --code-fg: #ffffff;
    --glow: rgba(143, 132, 255, 0.12);

    --text: var(--fg);
    --border: var(--line);
    --soft: var(--accent-soft);
    --btn: var(--accent);
    --btn-text: var(--accent-ink);
    --send: var(--accent-soft);
    --send-on: var(--accent);
    --send-on-text: var(--accent-ink);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --top-a: #2a2660; --top-b: #1d3358; --bg: #0b0a13; --panel: #141320; --fg: #ffffff; --muted: #cbd5e1;
  --line: #2c2a40; --accent: #8f84ff; --accent-ink: #0b0a13; --accent-soft: #2a2750; --bubble: #2a2750;
  --bubble-fg: #ffffff; --dark: #ffffff; --dark-fg: #0b0a13; --ok: #4ade80; --warn: #fbbf24; --warn-fg: #0b0a13;
  --danger: #f87171; --s-accent: #2dd4bf; --s-soft: #134e4a; --code-bg: #050508; --code-fg: #ffffff;
  --glow: rgba(143, 132, 255, 0.12);

  --text: var(--fg);
  --border: var(--line);
  --soft: var(--accent-soft);
  --btn: var(--accent);
  --btn-text: var(--accent-ink);
  --send: var(--accent-soft);
  --send-on: var(--accent);
  --send-on-text: var(--accent-ink);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14.5px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  display: flex;
}
svg { display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, .pill:focus-visible, .chip:focus-visible, .icon-btn:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* Sidebar navigation */
.side {
  width: 64px; flex: none; border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; align-self: flex-start;
  display: flex; flex-direction: column; align-items: center; padding-top: 14px; gap: 4px;
  background: var(--panel); z-index: 40;
}
.side .logo-wrap {
  width: 38px; height: 38px; border-radius: 10px; background: var(--dark); color: var(--dark-fg);
  display: grid; place-items: center; margin-bottom: 20px; cursor: pointer; transition: transform .15s ease;
}
.side .logo-wrap:hover { transform: scale(1.05); }
.side .logo { width: 22px; height: 22px; color: inherit; }
.side button {
  width: 38px; height: 38px; margin-bottom: 8px; border: 0; background: none; color: var(--muted);
  border-radius: 10px; display: grid; place-items: center; cursor: pointer; transition: all .15s ease;
  position: relative;
}
.side button svg { width: 20px; height: 20px; }
.side button:hover { background: var(--accent-soft); color: var(--accent); }
.side button::after {
  content: attr(data-tip); position: absolute; left: 48px; top: 50%; transform: translateY(-50%);
  background: var(--dark); color: var(--dark-fg); font-size: 12px; font-weight: 500; font-family: var(--font-body);
  padding: 5px 10px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s;
  box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 100;
}
.side button:hover::after, .side button:focus-visible::after { opacity: 1; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

/* First screen / Hero */
.first { position: relative; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
.center {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px 80px;
}
.glow {
  width: 100%; max-width: 1080px; display: flex; flex-direction: column; align-items: center;
  padding: 36px 0; border-radius: 160px;
  background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 70%);
}
.hero { margin: 0 0 24px; text-align: center; width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; }
h1 {
  margin: 0 0 4px; font-size: clamp(24px, 3vw, 40px); line-height: 1.2; font-weight: 700;
  letter-spacing: -0.03em; color: var(--fg);
}
h1 mark {
  background: none;
  -webkit-text-fill-color: unset;
  color: var(--fg);
  font-weight: 700;
  padding: 0;
}
.hero-sub {
  margin: 0 0 22px; font-size: clamp(14px, 1.5vw, 17px);
  font-weight: 400; color: var(--muted); letter-spacing: -0.01em; line-height: 1.5;
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px;
  text-align: center;
}
.type-inline {
  font-weight: 600; color: var(--fg);
  display: inline-flex; align-items: center;
}
#word {
  color: var(--fg);
}
.cursor {
  display: inline-block; width: 1.5px; height: 1em; margin-left: 2px;
  background: var(--fg); border-radius: 1px; vertical-align: -0.1em;
  animation: blink 1s steps(1) infinite;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes blink { 50% { opacity: 0; } }

/* Main Chat Box Input */
.box {
  width: 100%; max-width: 860px; height: 66px; border: 1px solid var(--line); border-radius: 18px;
  background: var(--panel); display: flex; align-items: center; gap: 14px; padding: 0 12px 0 20px;
  box-shadow: 0 10px 32px rgba(86, 70, 224, 0.08), 0 2px 6px rgba(0,0,0,0.02);
  transition: all .2s ease;
}
.box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft), 0 12px 40px rgba(86, 70, 224, 0.14);
}
.icon-btn {
  border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center;
  padding: 8px; border-radius: 50%; transition: all .15s;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
.box input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg);
  font-weight: 550; font-size: 16.5px; line-height: 1; font-family: var(--font-body); padding: 0;
}
.box input::placeholder { color: var(--muted); font-weight: 450; opacity: 0.95; }
.send {
  width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--accent-soft); color: var(--muted);
  display: grid; place-items: center; cursor: pointer; flex: none; transition: all .18s ease;
}
.send.on, .send:hover {
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 14px rgba(86, 70, 224, 0.35); transform: scale(1.04);
}

/* Chips */
.chips-wrap {
  display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap;
}
.chip {
  height: 42px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); font-weight: 600; font-size: 13.5px; line-height: 1;
  font-family: var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  transition: all .18s ease; text-decoration: none; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
}
.chip svg { color: var(--muted); transition: color .15s; flex-shrink: 0; }
.chip:hover {
  background: var(--accent-soft); color: var(--accent); border-color: var(--accent);
  transform: translateY(-1px); box-shadow: 0 4px 14px rgba(86, 70, 224, 0.12);
}
.chip:hover svg { color: var(--accent); }
.chip.accent-chip {
  background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); font-weight: 600;
}
.chip.accent-chip svg { color: var(--accent); }
.chip.accent-chip:hover {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
}
.chip.accent-chip:hover svg { color: var(--accent-ink); }

.foot {
  position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 13px; color: var(--muted);
  padding: 0 16px;
}
.foot a { color: var(--fg); text-decoration: underline; }

/* Demo section */
.demo { padding: 64px 24px 84px; display: flex; flex-direction: column; align-items: center; border-top: 1px solid var(--line); }
.demo-head { text-align: center; margin-bottom: 26px; max-width: 1000px; width: 100%; }
.demo h2 { margin: 0; font-size: clamp(22px, 2.2vw, 30px); font-weight: 700; letter-spacing: -0.01em; color: var(--fg); }
.demo-head p { margin: 8px auto 0; color: var(--muted); font-size: clamp(14px, 1.4vw, 16px); line-height: 1.5; max-width: 960px; }
.frame {
  width: 100%; max-width: 1040px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  background: var(--panel); box-shadow: 0 12px 40px rgba(86, 70, 224, 0.08); transition: box-shadow .2s;
}
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px; padding: 0 14px;
  border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 2;
}
.bar-dots { display: flex; align-items: center; gap: 7px; flex: none; }
.bar-dots i { width: 11px; height: 11px; border-radius: 50%; cursor: pointer; transition: transform .15s; }
.bar-dots .dot-red { background: #ff5f56; opacity: .85; }
.bar-dots .dot-yellow { background: #ffbd2e; opacity: .85; }
.bar-dots .dot-green { background: #27c93f; opacity: .85; }
.bar-dots i:hover { transform: scale(1.2); opacity: 1; }
.bar-url {
  font-size: 12px; font-weight: 500; font-family: var(--font-mono); color: var(--muted);
  background: var(--panel); padding: 4px 16px; border-radius: 8px; border: 1px solid var(--line); white-space: nowrap;
}
.bar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.stage-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px;
  font-size: 12px; font-weight: 600; font-family: var(--font-body); border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); cursor: pointer; transition: all .15s; text-decoration: none;
}
.stage-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.stage-tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.stage-btn:hover .stage-tag { background: var(--accent); color: var(--accent-ink); }
.stage-btn.restore-btn { background: var(--bg); color: var(--muted); }
.stage-btn.restore-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
.frame iframe { display: block; width: 100%; height: 720px; border: 0; background: var(--panel); }

/* Fullscreen expansion modes */
.frame.stage-1 {
  position: fixed!important; top: 0!important; right: 0!important; bottom: 0!important; left: 64px!important;
  width: auto!important; max-width: none!important; height: 100vh!important; height: 100dvh!important;
  z-index: 38!important; border-radius: 0!important; margin: 0!important; border: none!important;
  box-shadow: 0 0 60px rgba(0,0,0,.5)!important; display: flex!important; flex-direction: column!important;
  animation: exp1 .22s cubic-bezier(.16,1,.3,1);
}
@media (max-width: 820px) { .frame.stage-1 { left: 0!important; } }
.frame.stage-1 iframe { flex: 1!important; height: calc(100% - 44px)!important; width: 100%!important; }
.frame.stage-2 {
  position: fixed!important; top: 0!important; left: 0!important; right: 0!important; bottom: 0!important;
  width: 100vw!important; max-width: none!important; height: 100vh!important; height: 100dvh!important;
  z-index: 9999!important; border-radius: 0!important; margin: 0!important; border: none!important;
  box-shadow: 0 0 80px rgba(0,0,0,.7)!important; display: flex!important; flex-direction: column!important;
  animation: exp2 .22s cubic-bezier(.16,1,.3,1);
}
.frame.stage-2 iframe { flex: 1!important; height: calc(100% - 44px)!important; width: 100%!important; }
@keyframes exp1 { from { opacity: .9; transform: scale(.985); } to { opacity: 1; transform: none; } }
@keyframes exp2 { from { opacity: .9; transform: scale(.985); } to { opacity: 1; transform: none; } }

/* Pricing section */
.price { padding: 64px 24px 96px; display: flex; flex-direction: column; align-items: center; border-top: 1px solid var(--line); }
.price h2 { margin: 0; font-size: clamp(24px, 2.5vw, 34px); font-weight: 700; letter-spacing: -0.01em; color: var(--fg); }
.plans { width: 100%; max-width: 1040px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.plan {
  border: 1px solid var(--line); border-radius: 18px; padding: 30px; display: flex; flex-direction: column;
  background: var(--panel); position: relative; transition: all .2s ease;
  box-shadow: 0 4px 18px rgba(0,0,0,0.02);
}
.plan:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(86, 70, 224, 0.08); }
.plan.main {
  border: 2px solid var(--accent); box-shadow: 0 12px 40px rgba(86, 70, 224, 0.12);
}
.badge {
  position: absolute; top: -13px; left: 26px; background: var(--accent); color: var(--accent-ink);
  font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
  box-shadow: 0 2px 8px rgba(86, 70, 224, 0.35);
}
.plan .tag { font-size: 17px; font-weight: 700; color: var(--fg); }
.plan .note { color: var(--muted); font-size: 14.5px; margin-top: 3px; }
.amount { margin: 20px 0 0; font-size: clamp(36px, 3.8vw, 48px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: var(--fg); }
.amount small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.per { margin-top: 6px; color: var(--muted); font-size: 14px; }
.plan ul { list-style: none; margin: 22px 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.plan li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.45; color: var(--fg); }
.plan li svg { flex: none; margin-top: 2px; color: var(--ok); }
.guar { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; margin-bottom: 22px; font-size: 13.5px; line-height: 1.5; color: var(--bubble-fg); }
.guar b { display: block; color: var(--accent); font-size: 14px; margin-bottom: 3px; }
.cta {
  margin-top: auto; display: grid; place-items: center; height: 48px; border-radius: 12px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15.5px;
  text-decoration: none; transition: all .15s ease; box-shadow: 0 4px 14px rgba(86, 70, 224, 0.28);
}
.cta:hover { filter: brightness(1.1); transform: translateY(-1px); }
.cta.alt {
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); box-shadow: none;
}
.cta.alt:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.partner-note {
  width: 100%; max-width: 1040px; margin-top: 22px; display: flex; align-items: center; justify-content: center;
  gap: 8px; font-size: 13.5px; color: var(--muted); line-height: 1.5; text-align: center;
}
.partner-note svg { flex: none; color: var(--accent); }
.partner-note b { color: var(--fg); font-weight: 600; }

/* Footer */
.site { border-top: 1px solid var(--line); background: var(--panel); padding: 36px 24px calc(28px + env(safe-area-inset-bottom, 0px)); }
.fin { max-width: 1040px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
.fin b { display: block; font-size: 16px; font-weight: 700; color: var(--fg); }
.fin span { color: var(--muted); font-size: 13.5px; }
.fin nav { display: flex; gap: 22px; font-size: 14px; }
.fin a { color: var(--muted); text-decoration: none; transition: color .15s; }
.fin a:hover { color: var(--accent); text-decoration: none; }
.fsmall { max-width: 1040px; margin: 24px auto 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* Dialogs / Modals */
dialog { border: 0; padding: 0; background: transparent; color: var(--fg); max-width: none; overflow: visible; }
dialog::backdrop { background: rgba(31, 29, 51, 0.55); backdrop-filter: blur(4px); }
.dcard {
  position: relative; width: min(440px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line);
  border-radius: 20px; padding: 36px 28px 24px; text-align: center; box-shadow: 0 24px 60px rgba(31, 29, 51, 0.25);
}
.dcard h3 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; color: var(--fg); }
.dcard p { margin: 8px 0 22px; color: var(--muted); font-size: 14.5px; }
.dx {
  position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border: 0; border-radius: 8px;
  background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: all .15s;
}
.dx:hover { background: var(--accent-soft); color: var(--accent); }
.sso, .dcard input, .go { display: block; width: 100%; height: 46px; border-radius: 12px; font-family: var(--font-body); font-size: 15px; }
.sso { margin-bottom: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-weight: 500; cursor: pointer; }
.sso:hover { background: var(--bg); border-color: var(--muted); }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 14px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.dcard input { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0 16px; outline: 0; margin-bottom: 10px; }
.dcard input:focus { border-color: var(--accent); }
.go { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; transition: all .15s; }
.go:hover { filter: brightness(1.1); }

/* Ideas Explorer Modal */
.ixd { width: min(1080px, calc(100vw - 32px)); height: min(740px, calc(100dvh - 32px)); max-height: none; margin: auto; }
.ixm {
  position: relative; display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100%; background: var(--panel);
  border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: 0 24px 70px rgba(31, 29, 51, 0.3);
}
.ixd[open] .ixm { animation: ixin .24s cubic-bezier(.2,.8,.2,1); }
@keyframes ixin { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.ixs { display: flex; flex-direction: column; min-height: 0; padding: 24px 14px 16px; border-right: 1px solid var(--line); background: var(--bg); }
.ixs h3 { margin: 0 10px; font-size: 20px; font-weight: 700; color: var(--fg); }
.ixs p { margin: 6px 10px 16px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
#icat { display: flex; flex-direction: column; gap: 2px; overflow: auto; min-height: 0; padding-bottom: 4px; }
.cat {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 0; background: none; color: var(--fg);
  padding: 9px 12px; border-radius: 10px; font: inherit; font-size: 14px; text-align: left; cursor: pointer; transition: all .15s;
}
.cat span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.cat:hover { background: var(--accent-soft); color: var(--accent); }
.cat.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.cat.on span { color: inherit; opacity: .8; }
.ixc { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.ixh { display: flex; align-items: center; gap: 16px; padding: 20px 54px 14px 24px; }
.ixsr { position: relative; flex: 1; min-width: 0; }
.ixsr svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.ixsr input {
  width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  color: var(--fg); padding: 0 16px 0 44px; font: inherit; font-size: 15px; outline: 0;
}
.ixsr input:focus { border-color: var(--accent); background: var(--panel); }
#ic { flex: none; color: var(--muted); font-size: 13.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ixg {
  flex: 1; min-height: 0; overflow: auto; padding: 4px 24px 24px; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; align-content: start; overscroll-behavior: contain;
}
.idea {
  display: flex; flex-direction: column; gap: 5px; text-align: left; border: 1px solid var(--line); background: var(--panel);
  color: var(--fg); border-radius: 14px; padding: 14px 15px; font-family: var(--font-body); cursor: pointer; transition: all .16s ease;
}
.idea:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(86, 70, 224, 0.12); }
.idea i { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.idea b { font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--fg); }
.idea small { font-size: 13px; color: var(--muted); line-height: 1.35; }
.idea .th { display: block; width: 100%; aspect-ratio: 2/1; border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
.idea .th svg { width: 100%; height: 100%; }
.iempty { grid-column: 1/-1; color: var(--muted); padding: 48px 0; text-align: center; }

#idt {
  position: absolute; inset: 0; z-index: 6; background: var(--panel); display: none;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px 32px; padding: 36px 36px 24px; overflow: auto; align-content: start;
}
#idt.on { display: grid; }
.bk { grid-column: 1/-1; justify-self: start; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; padding: 0; }
.bk:hover { color: var(--accent); }
.dv { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
.dv svg { width: 100%; height: auto; }
.dt .dc { font-style: normal; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.dt h4 { margin: 6px 0 0; font-size: 24px; letter-spacing: -0.02em; line-height: 1.2; color: var(--fg); }
.dt h5 { margin: 18px 0 4px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dt p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--fg); }
.dbtn {
  margin-top: 22px; height: 46px; padding: 0 24px; border: 0; border-radius: 12px;

    }

    function nextStage() {
      if (currentStage === 0) {
        currentStage = 1;
        updateStageUI();
      } else if (currentStage === 1) {
        currentStage = 2;
        updateStageUI();
      } else if (currentStage === 2) {
        window.open('https://runnerflo.com', '_blank', 'noopener');
      }
    }

    function setStage(s) {
      currentStage = s;
      updateStageUI();
    }

    function restore() {
      currentStage = 0;
      updateStageUI();
    }

    if (btnNext) btnNext.addEventListener('click', nextStage);
    if (btnRestore) btnRestore.addEventListener('click', restore);
    if (dotRed) dotRed.addEventListener('click', restore);
    if (dotYellow) dotYellow.addEventListener('click', function() { setStage(1); });
    if (dotGreen) dotGreen.addEventListener('click', function() { setStage(2); });

    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && currentStage > 0) {
        restore();
      }
    });
  })();
</script>
</body>
</html>
